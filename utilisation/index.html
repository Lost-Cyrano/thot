<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thot – Utilisation</title>
  <style>
    :root {
      --red: #e60000;
      --red-hover: #b30000;
      --bg: #f5f5f5;
      --card-bg: #ffffff;
      --border: #ddd;
      --text: #333;
      --text-light: #666;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --ok: #4caf50;
      --warning: #f5a623;
      --danger: #e60000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    .header-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .header-buttons { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-back {
      background: transparent;
      border: 1.5px solid #ccc;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-back:hover { background: #eee; }

    .btn-logout {
      background: transparent;
      color: var(--red);
      border: 1.5px solid var(--red);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-logout:hover { background: var(--red); color: #fff; }

    .btn-primary {
      background: var(--red);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .btn-primary:hover { background: var(--red-hover); }

    /* Sections */
    .section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-header {
      padding: 14px 18px;
      background: #fafafa;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      font-size: 0.75rem;
      background: #f0f0f0;
      padding: 3px 8px;
      border-radius: 10px;
      color: var(--text-light);
      white-space: nowrap;
    }
    .badge.ok { background: #e8f5e9; color: #2e7d32; }
    .badge.warning { background: #fff8f0; color: var(--warning); }
    .badge.danger { background: #fff0f0; color: var(--danger); }

    /* Listes */
    .list { list-style: none; max-height: 400px; overflow-y: auto; }

    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid #f0f0f0;
      flex-wrap: wrap;
      gap: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .list-item:hover { background: #fafafa; }
    .list-item:last-child { border-bottom: none; }

    .user-info { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .user-avatar {
      width: 36px; height: 36px; border-radius: 50%; background: #eee;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 0.9rem; flex-shrink: 0; color: #666;
    }
    .user-name { font-weight: 600; font-size: 0.95rem; }
    .user-nivol { color: var(--text-light); font-size: 0.8rem; }

    /* Quantités */
    .qty-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .qty-btn {
      width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid #ccc;
      background: #fff; font-size: 1.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .qty-btn:hover { background: #f0f0f0; }
    .qty-num { font-weight: 600; font-size: 1.1rem; min-width: 30px; text-align: center; }

    /* Recherche */
    .search-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      box-shadow: var(--shadow);
    }
    .search-bar input {
      width: 100%;
      padding: 10px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
    }

    /* Boutons d'action */
    .action-buttons { display: flex; gap: 12px; flex-wrap: wrap; }

    .btn-action {
      flex: 1;
      min-width: 180px;
      padding: 14px 20px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.2s;
      text-align: center;
      border: none;
      color: #fff;
    }
    .btn-action.primary { background: var(--red); }
    .btn-action.primary:hover { background: var(--red-hover); }
    .btn-action.secondary { background: var(--warning); }
    .btn-action.secondary:hover { background: #e09600; }
    .btn-action.success { background: var(--ok); }
    .btn-action.success:hover { background: #388e3c; }

    /* Modals */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 16px;
    }
    .modal {
      background: #fff; border-radius: var(--radius); padding: 24px;
      width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow-y: auto;
    }
    .modal h3 { font-size: 1.1rem; }
    .modal label { font-weight: 600; display: block; margin-bottom: 4px; font-size: 0.9rem; }
    .modal input, .modal select {
      width: 100%; padding: 10px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 0.95rem;
    }
    .modal .hint { font-size: 0.8rem; color: var(--text-light); margin-top: 4px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 8px; }

    .btn {
      padding: 10px 18px; border: none; border-radius: 8px;
      cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s;
    }
    .btn-cancel { background: #eee; color: #333; }
    .btn-cancel:hover { background: #ddd; }
    .btn-save { background: var(--red); color: #fff; }
    .btn-save:hover { background: var(--red-hover); }
    .btn-danger { background: #c00; color: #fff; }
    .btn-danger:hover { background: #a00; }

    /* Aperçu des objets récents */
    .recent-items { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 18px; }
    .recent-chip {
      background: #f0f0f0; border: 1px solid #ddd; padding: 4px 10px;
      border-radius: 16px; font-size: 0.8rem; cursor: pointer;
      transition: all 0.2s; display: inline-flex; align-items: center; gap: 4px;
    }
    .recent-chip:hover { background: var(--red); color: #fff; border-color: var(--red); }

    /* Empty */
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }

    /* Loading */
    .loading { text-align: center; padding: 20px; color: var(--text-light); }

    @media (max-width: 480px) {
      .header { flex-direction: column; align-items: flex-start; }
      .header-buttons { width: 100%; justify-content: flex-end; }
      .list-item { flex-direction: column; align-items: flex-start; }
      .qty-controls { align-self: flex-end; }
      .action-buttons { flex-direction: column; }
      .btn-action { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <span style="font-weight: 600;">📦 Utilisation des inventaires</span>
      </div>
      <div class="header-buttons">
        <button class="btn-back" id="btn-home">← Menu</button>
        <button class="btn-logout" id="btn-logout">Déconnexion</button>
      </div>
    </div>

    <!-- Barre de recherche -->
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="🔍 Rechercher un objet ou un inventaire...">
    </div>

    <!-- Contenu -->
    <div id="content">
      <div class="loading">Chargement...</div>
    </div>

    <!-- Boutons d'action -->
    <div class="action-buttons" id="action-buttons" style="display:none;">
      <button class="btn-action primary" id="btn-add-usage">➕ Ajouter du matériel utilisé</button>
      <button class="btn-action success" id="btn-rearm">🔄 Réarmer les inventaires</button>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal" id="modal-content"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, deleteUser } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, getDocs, collection, setDoc, updateDoc, deleteDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA1V3UybXWyyMmO9fBH7jhuVUSFL3mDBPo",
      authDomain: "crf--thot.firebaseapp.com",
      projectId: "crf--thot",
      storageBucket: "crf--thot.firebasestorage.app",
      messagingSenderId: "242106713414",
      appId: "1:242106713414:web:76f4c6977264539ef85147",
      measurementId: "G-NF6W8FS69P"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Collection dédiée aux utilisations
    const USAGE_COLLECTION = 'UT';

    let currentUser = null;
    let userRole = null;

    // Données
    let inventories = [];
    let usages = [];
    let unsubscribeUsages = null;

    // État de réarmement
    let rearmMode = false;
    let rearmChecked = {}; // { usageId: bool }

    // DOM
    const contentEl = document.getElementById('content');
    const searchInput = document.getElementById('search-input');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalContent = document.getElementById('modal-content');
    const actionButtons = document.getElementById('action-buttons');
    const btnAddUsage = document.getElementById('btn-add-usage');
    const btnRearm = document.getElementById('btn-rearm');

    // ===== AUTH =====
    onAuthStateChanged(auth, async (user) => {
      if (!user) { redirectToLogin(); return; }
      const nivol = user.displayName;
      if (!nivol) { await deleteUser(user).catch(() => {}); redirectToLogin(); return; }

      try {
        // Vérifier admin ou user
        const adminSnap = await getDoc(doc(db, 'A', nivol));
        if (adminSnap.exists()) {
          userRole = 'admin';
          currentUser = { nivol, nom: adminSnap.data().I || 'Inconnu', fonction: adminSnap.data().F || '' };
        } else {
          const userSnap = await getDoc(doc(db, 'U', nivol));
          if (userSnap.exists()) {
            userRole = 'user';
            currentUser = { nivol, nom: userSnap.data().I || 'Inconnu' };
          } else {
            await deleteUser(user).catch(() => {});
            redirectToLogin();
            return;
          }
        }

        // Bouton menu → admin ou user selon le rôle
        document.getElementById('btn-home').onclick = () => {
          window.location.href = userRole === 'admin' ? '../admin.html' : '../user.html';
        };

        await loadInventories();
        setupRealtimeUsages();
        renderMain();

      } catch (err) {
        console.error(err);
        if (auth.currentUser) await deleteUser(auth.currentUser).catch(() => {});
        redirectToLogin();
      }
    });

    function redirectToLogin() {
      const currentUrl = encodeURIComponent(window.location.href);
      window.location.href = `../login.html?redirect=${currentUrl}`;
    }

    document.getElementById('btn-logout').addEventListener('click', async () => {
      const user = auth.currentUser;
      if (user) { await deleteUser(user).catch(() => {}); window.location.href = '../login.html'; }
    });

    // ===== CHARGEMENT INVENTAIRES =====
    async function loadInventories() {
      try {
        const snap = await getDocs(collection(db, 'I'));
        inventories = [];
        snap.forEach(d => {
          const data = d.data();
          inventories.push({
            id: d.id,
            nom: data.nom || d.id,
            objets: data.objets || {}
          });
        });
      } catch (e) { console.error(e); }
    }

    // ===== TEMPS RÉEL USAGES =====
    function setupRealtimeUsages() {
      if (unsubscribeUsages) unsubscribeUsages();
      unsubscribeUsages = onSnapshot(collection(db, USAGE_COLLECTION), (snap) => {
        usages = [];
        snap.forEach(d => {
          usages.push({ id: d.id, ...d.data() });
        });
        // Tri par date de création (plus récent en premier)
        usages.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
        renderMain();
      }, (err) => {
        console.error('Realtime error:', err);
      });
    }

    // ===== HELPERS =====
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getObjectAtPath(objets, path) {
      let current = objets;
      const parts = path.split('.');
      for (const part of parts) {
        if (current[part] === undefined) return null;
        current = current[part];
      }
      return current;
    }

    function formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('fr-FR');
    }

    // Récupérer tous les objets disponibles depuis tous les inventaires
    // avec leur chemin complet et nom d'inventaire
    function getAllObjects() {
      const result = [];
      inventories.forEach(inv => {
        const extract = (objets, path, parentPath) => {
          Object.keys(objets).forEach(key => {
            if (key === '_sub') return;
            const item = objets[key];
            const fullPath = parentPath ? `${parentPath}.${key}` : key;
            if (item && typeof item === 'object') {
              if (item._sub === true) {
                extract(item, fullPath, fullPath);
              } else if (item.q !== undefined) {
                result.push({
                  inventaireId: inv.id,
                  inventaireNom: inv.nom,
                  path: fullPath,
                  nom: key,
                  quantite: item.q,
                  date: item.d || null
                });
              }
            }
          });
        };
        extract(inv.objets, '', '');
      });
      return result;
    }

    // ===== RENDU PRINCIPAL =====
    function renderMain() {
      actionButtons.style.display = 'flex';

      if (rearmMode) {
        renderRearmMode();
        return;
      }

      renderUsageList();
    }

    function renderUsageList() {
      const search = (searchInput.value || '').toLowerCase().trim();

      // Filtrer les usages
      const filteredUsages = usages.filter(u => {
        if (!search) return true;
        const invName = getInventoryName(u.inventaireId).toLowerCase();
        const objName = (u.objetNom || '').toLowerCase();
        return invName.includes(search) || objName.includes(search);
      });

      // Regrouper par objet (inventaire + path)
      const grouped = {};
      filteredUsages.forEach(u => {
        const key = `${u.inventaireId}|${u.path}`;
        if (!grouped[key]) {
          grouped[key] = {
            inventaireId: u.inventaireId,
            inventaireNom: getInventoryName(u.inventaireId),
            path: u.path,
            objetNom: u.objetNom,
            quantite: 0,
            usages: []
          };
        }
        grouped[key].quantite += u.quantite || 0;
        grouped[key].usages.push(u);
      });

      const items = Object.values(grouped);

      let html = `
        <div class="section">
          <div class="section-header">
            <span>📋 Matériel utilisé (à réarmer)</span>
            <span class="badge warning">${items.length} objet(s)</span>
          </div>
      `;

      if (items.length === 0) {
        html += `<div class="empty-state"><div class="icon">📦</div><p>Aucun matériel utilisé pour le moment.</p></div>`;
      } else {
        html += '<ul class="list">';
        items.forEach(item => {
          html += `
            <li class="list-item">
              <div class="user-info">
                <div class="user-avatar">${escapeHtml(item.inventaireNom.charAt(0).toUpperCase())}</div>
                <div>
                  <div class="user-name">${escapeHtml(item.objetNom)} ×${item.quantite}</div>
                  <div class="user-nivol">📋 ${escapeHtml(item.inventaireNom)} · ${escapeHtml(item.path)}</div>
                </div>
              </div>
              <span class="badge warning">À réarmer</span>
            </li>
          `;
        });
        html += '</ul>';
      }
      html += '</div>';

      contentEl.innerHTML = html;

      // Mettre à jour le bouton réarmer
      if (items.length === 0) {
        btnRearm.disabled = true;
        btnRearm.style.opacity = '0.5';
        btnRearm.style.cursor = 'not-allowed';
      } else {
        btnRearm.disabled = false;
        btnRearm.style.opacity = '1';
        btnRearm.style.cursor = 'pointer';
      }
    }

    function getInventoryName(invId) {
      const inv = inventories.find(i => i.id === invId);
      return inv ? inv.nom : invId;
    }

    // ===== MODE RÉARMEMENT =====
    function renderRearmMode() {
      // Regrouper les usages par objet
      const grouped = {};
      usages.forEach(u => {
        const key = `${u.inventaireId}|${u.path}`;
        if (!grouped[key]) {
          grouped[key] = {
            inventaireId: u.inventaireId,
            inventaireNom: getInventoryName(u.inventaireId),
            path: u.path,
            objetNom: u.objetNom,
            quantite: 0,
            usageIds: []
          };
        }
        grouped[key].quantite += u.quantite || 0;
        grouped[key].usageIds.push(u.id);
      });

      const items = Object.values(grouped);
      const checkedCount = Object.keys(rearmChecked).filter(k => rearmChecked[k]).length;

      let html = `
        <div class="section">
          <div class="section-header">
            <span>🔄 Réarmer les inventaires</span>
            <span class="badge ok">${checkedCount}/${items.length} réarmés</span>
          </div>
          <div style="padding:12px 18px;background:#fff8f0;border-bottom:1px solid #f0f0f0;font-size:0.85rem;color:#666;">
            Cochez chaque objet que vous avez réarmé. Les objets non cochés seront marqués comme <strong>absents</strong>.
          </div>
          <ul class="list" id="rearm-list">
      `;

      items.forEach(item => {
        const key = `${item.inventaireId}|${item.path}`;
        const checked = rearmChecked[key] ? 'checked' : '';
        html += `
          <li class="list-item" data-key="${escapeHtml(key)}">
            <div class="user-info" style="cursor:pointer;flex:1;">
              <input type="checkbox" class="rearm-checkbox" data-key="${escapeHtml(key)}" ${checked} style="width:24px;height:24px;cursor:pointer;flex-shrink:0;">
              <div style="margin-left:10px;">
                <div class="user-name">${escapeHtml(item.objetNom)} ×${item.quantite}</div>
                <div class="user-nivol">📋 ${escapeHtml(item.inventaireNom)} · ${escapeHtml(item.path)}</div>
              </div>
            </div>
          </li>
        `;
      });

      html += `
          </ul>
        </div>
        <div class="action-buttons" style="margin-top:12px;">
          <button class="btn-action secondary" id="btn-cancel-rearm">✖ Annuler</button>
          <button class="btn-action success" id="btn-validate-rearm">✅ Valider le réarmement</button>
        </div>
      `;

      contentEl.innerHTML = html;
      actionButtons.style.display = 'none';

      // Événements checkbox
      document.querySelectorAll('.rearm-checkbox').forEach(cb => {
        cb.addEventListener('change', (e) => {
          const key = cb.dataset.key;
          rearmChecked[key] = cb.checked;
          // Mettre à jour le badge
          const total = document.querySelectorAll('.rearm-checkbox').length;
          const checked = document.querySelectorAll('.rearm-checkbox:checked').length;
          const badge = document.querySelector('.section-header .badge');
          if (badge) badge.textContent = `${checked}/${total} réarmés`;
        });
      });

      document.getElementById('btn-cancel-rearm').addEventListener('click', () => {
        rearmMode = false;
        rearmChecked = {};
        renderMain();
      });

      document.getElementById('btn-validate-rearm').addEventListener('click', () => {
        validateRearm(grouped);
      });
    }

    // ===== VALIDATION RÉARMEMENT =====
    async function validateRearm(grouped) {
      const items = Object.values(grouped);
      if (items.length === 0) return;

      const missingItems = items.filter(item => {
        const key = `${item.inventaireId}|${item.path}`;
        return !rearmChecked[key];
      });

      const message = missingItems.length > 0
        ? `${missingItems.length} objet(s) non réarmé(s) seront marqués comme <strong>absents</strong>.`
        : 'Tous les objets ont été réarmés.';

      modalContent.innerHTML = `
        <h3>Confirmer le réarmement</h3>
        <p>${message}</p>
        ${missingItems.length > 0 ? `
          <div style="background:#fff0f0;padding:12px;border-radius:8px;max-height:200px;overflow-y:auto;font-size:0.85rem;">
            ${missingItems.map(i => `<div style="padding:4px 0;border-bottom:1px solid #f5e5e5;">❌ ${escapeHtml(i.objetNom)} ×${i.quantite} (${escapeHtml(i.inventaireNom)})</div>`).join('')}
          </div>
        ` : ''}
        <div class="modal-actions">
          <button class="btn btn-cancel" id="modal-cancel">Annuler</button>
          <button class="btn btn-save" id="modal-confirm">Confirmer</button>
        </div>
      `;
      modalOverlay.style.display = 'flex';

      document.getElementById('modal-cancel').addEventListener('click', closeModal);
      document.getElementById('modal-confirm').addEventListener('click', async () => {
        try {
          // 1. Pour chaque inventaire concerné, marquer les objets manquants comme absents
          const invIds = new Set(items.map(i => i.inventaireId));

          for (const invId of invIds) {
            const inv = inventories.find(i => i.id === invId);
            if (!inv) continue;

            const invItems = items.filter(i => i.inventaireId === invId);
            const invMissing = invItems.filter(i => !rearmChecked[`${i.inventaireId}|${i.path}`]);

            if (invMissing.length === 0) continue;

            // Construire le tableau des manquants (format "Nom (Catégorie)")
            const manquantsSnap = await getDoc(doc(db, 'I', invId));
            const currentManquants = manquantsSnap.data().manquants || [];

            const newEntries = invMissing.map(i => `${i.objetNom} (${i.path})`);
            const newManquants = [...new Set([...currentManquants, ...newEntries])];

            await updateDoc(doc(db, 'I', invId), { manquants: newManquants });
          }

          // 2. Supprimer tous les usages de la collection
          for (const u of usages) {
            await deleteDoc(doc(db, USAGE_COLLECTION, u.id));
          }

          // 3. Sortir du mode réarmement
          rearmMode = false;
          rearmChecked = {};
          closeModal();
          renderMain();

        } catch (e) {
          console.error(e);
          alert('Erreur : ' + e.message);
        }
      });
    }

    // ===== BOUTONS D'ACTION =====
    btnAddUsage.addEventListener('click', () => openAddUsageModal());

    btnRearm.addEventListener('click', () => {
      if (usages.length === 0) return;
      rearmMode = true;
      rearmChecked = {};
      renderMain();
    });

    // ===== RECHERCHE =====
    searchInput.addEventListener('input', () => {
      if (!rearmMode) renderUsageList();
    });

    // ===== MODAL AJOUT USAGE =====
    function openAddUsageModal() {
      const allObjects = getAllObjects();

      // Trier par inventaire puis par nom
      allObjects.sort((a, b) => {
        if (a.inventaireNom !== b.inventaireNom) {
          return a.inventaireNom.localeCompare(b.inventaireNom, 'fr');
        }
        return a.nom.localeCompare(b.nom, 'fr');
      });

      // Récents (derniers objets utilisés par cet utilisateur)
      const recentKeys = new Set(
        usages
          .filter(u => u.par === currentUser.nivol)
          .slice(0, 5)
          .map(u => `${u.inventaireId}|${u.path}`)
      );

      const recentObjects = allObjects.filter(o => recentKeys.has(`${o.inventaireId}|${o.path}`));

      modalContent.innerHTML = `
        <h3>➕ Ajouter du matériel utilisé</h3>
        <div>
          <label>Rechercher un objet</label>
          <input type="text" id="modal-search" placeholder="Nom de l'objet ou de l'inventaire..." autofocus>
        </div>
        ${recentObjects.length > 0 ? `
          <div>
            <label style="margin-bottom:6px;">Utilisés récemment</label>
            <div class="recent-items" style="padding:0;">
              ${recentObjects.map(o => `
                <div class="recent-chip" data-inv="${escapeHtml(o.inventaireId)}" data-path="${escapeHtml(o.path)}" data-nom="${escapeHtml(o.nom)}">
                  ${escapeHtml(o.nom)} <span style="opacity:0.6;">(${escapeHtml(o.inventaireNom)})</span>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}
        <div style="max-height:300px;overflow-y:auto;border:1px solid #eee;border-radius:8px;" id="modal-object-list">
          ${renderObjectListHTML(allObjects, '')}
        </div>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="modal-cancel">Annuler</button>
        </div>
      `;
      modalOverlay.style.display = 'flex';

      // Recherche dans le modal
      const modalSearch = document.getElementById('modal-search');
      const objectList = document.getElementById('modal-object-list');

      modalSearch.addEventListener('input', () => {
        const q = modalSearch.value.toLowerCase().trim();
        const filtered = allObjects.filter(o =>
          o.nom.toLowerCase().includes(q) ||
          o.inventaireNom.toLowerCase().includes(q) ||
          o.path.toLowerCase().includes(q)
        );
        objectList.innerHTML = renderObjectListHTML(filtered, q);
        attachObjectClickEvents();
      });

      // Chips récents
      document.querySelectorAll('.recent-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const invId = chip.dataset.inv;
          const path = chip.dataset.path;
          const nom = chip.dataset.nom;
          closeModal();
          openQuantityModal(invId, path, nom);
        });
      });

      document.getElementById('modal-cancel').addEventListener('click', closeModal);
      attachObjectClickEvents();
    }

    function renderObjectListHTML(objects, searchQuery) {
      if (objects.length === 0) {
        return '<div style="padding:20px;text-align:center;color:#999;">Aucun objet trouvé.</div>';
      }
      let html = '';
      let currentInv = '';
      objects.forEach(o => {
        if (o.inventaireNom !== currentInv) {
          currentInv = o.inventaireNom;
          html += `<div style="padding:8px 12px;background:#fafafa;font-weight:600;font-size:0.85rem;color:#666;border-bottom:1px solid #eee;">📋 ${escapeHtml(currentInv)}</div>`;
        }
        const highlight = searchQuery
          ? escapeHtml(o.nom).replace(new RegExp(`(${searchQuery})`, 'gi'), '<mark>$1</mark>')
          : escapeHtml(o.nom);
        html += `
          <div class="obj-choice" data-inv="${escapeHtml(o.inventaireId)}" data-path="${escapeHtml(o.path)}" data-nom="${escapeHtml(o.nom)}"
               style="padding:10px 12px;border-bottom:1px solid #f5f5f5;cursor:pointer;transition:background 0.15s;"
               onmouseover="this.style.background='#fafafa'"
               onmouseout="this.style.background=''">
            <div style="font-weight:600;font-size:0.95rem;">${highlight}</div>
            <div style="font-size:0.75rem;color:#999;">${escapeHtml(o.path)} · Qté: ${o.quantite}</div>
          </div>
        `;
      });
      return html;
    }

    function attachObjectClickEvents() {
      document.querySelectorAll('.obj-choice').forEach(choice => {
        choice.addEventListener('click', () => {
          const invId = choice.dataset.inv;
          const path = choice.dataset.path;
          const nom = choice.dataset.nom;
          closeModal();
          openQuantityModal(invId, path, nom);
        });
      });
    }

    function openQuantityModal(invId, path, nom) {
      modalContent.innerHTML = `
        <h3>Quantité utilisée</h3>
        <div style="background:#f5f5f5;padding:12px;border-radius:8px;">
          <div style="font-weight:600;">${escapeHtml(nom)}</div>
          <div style="font-size:0.85rem;color:#666;">📋 ${escapeHtml(getInventoryName(invId))} · ${escapeHtml(path)}</div>
        </div>
        <div>
          <label>Quantité utilisée</label>
          <input type="number" id="modal-qty" value="1" min="1" autofocus>
        </div>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="modal-cancel">Annuler</button>
          <button class="btn btn-save" id="modal-save">Ajouter</button>
        </div>
      `;
      modalOverlay.style.display = 'flex';

      document.getElementById('modal-cancel').addEventListener('click', closeModal);
      document.getElementById('modal-save').addEventListener('click', async () => {
        const qty = parseInt(document.getElementById('modal-qty').value) || 0;
        if (qty <= 0) return alert('Quantité invalide.');

        try {
          const usageRef = doc(collection(db, USAGE_COLLECTION));
          await setDoc(usageRef, {
            inventaireId: invId,
            path: path,
            objetNom: nom,
            quantite: qty,
            par: currentUser.nivol,
            nomPar: currentUser.nom,
            createdAt: new Date().toISOString()
          });
          closeModal();
        } catch (e) {
          alert('Erreur : ' + e.message);
        }
      });
    }

    function closeModal() {
      modalOverlay.style.display = 'none';
      modalContent.innerHTML = '';
    }

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });
  </script>
</body>
</html>
