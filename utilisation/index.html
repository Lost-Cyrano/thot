<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thot – Utilisation</title>
  <style>
    :root {
      --red: #e60000;
      --red-hover: #b30000;
      --bg: #f5f5f5;
      --card-bg: #ffffff;
      --border: #ddd;
      --text: #333;
      --text-light: #666;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --ok: #4caf50;
      --warning: #f5a623;
      --danger: #e60000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    .header-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .header-buttons { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-back {
      background: transparent;
      border: 1.5px solid #ccc;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-back:hover { background: #eee; }

    .btn-logout {
      background: transparent;
      color: var(--red);
      border: 1.5px solid var(--red);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-logout:hover { background: var(--red); color: #fff; }

    .btn-primary {
      background: var(--red);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .btn-primary:hover { background: var(--red-hover); }

    /* Sections */
    .section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-header {
      padding: 14px 18px;
      background: #fafafa;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      font-size: 0.75rem;
      background: #f0f0f0;
      padding: 3px 8px;
      border-radius: 10px;
      color: var(--text-light);
      white-space: nowrap;
    }
    .badge.ok { background: #e8f5e9; color: #2e7d32; }
    .badge.warning { background: #fff8f0; color: var(--warning); }
    .badge.danger { background: #fff0f0; color: var(--danger); }

    /* Listes */
    .list { list-style: none; max-height: 400px; overflow-y: auto; }

    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid #f0f0f0;
      flex-wrap: wrap;
      gap: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .list-item:hover { background: #fafafa; }
    .list-item:last-child { border-bottom: none; }

    .user-info { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .user-avatar {
      width: 36px; height: 36px; border-radius: 50%; background: #eee;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 0.9rem; flex-shrink: 0; color: #666;
    }
    .user-name { font-weight: 600; font-size: 0.95rem; }
    .user-nivol { color: var(--text-light); font-size: 0.8rem; }

    /* Quantités */
    .qty-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .qty-btn {
      width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid #ccc;
      background: #fff; font-size: 1.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .qty-btn:hover { background: #f0f0f0; }
    .qty-num { font-weight: 600; font-size: 1.1rem; min-width: 30px; text-align: center; }

    /* Recherche */
    .search-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .search-bar input {
      width: 100%;
      padding: 10px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
    }

    /* Sélection des inventaires */
    .inv-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .inv-chip {
      padding: 6px 14px;
      border-radius: 16px;
      background: #f0f0f0;
      border: 1.5px solid transparent;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
      user-select: none;
    }
    .inv-chip:hover { background: #e8e8e8; }
    .inv-chip.selected {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }

    /* Boutons d'action */
    .action-buttons { display: flex; gap: 12px; flex-wrap: wrap; }

    .btn-action {
      flex: 1;
      min-width: 180px;
      padding: 14px 20px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.2s;
      text-align: center;
      border: none;
      color: #fff;
    }
    .btn-action.primary { background: var(--red); }
    .btn-action.primary:hover { background: var(--red-hover); }
    .btn-action.success { background: var(--ok); }
    .btn-action.success:hover { background: #388e3c; }
    .btn-action.secondary { background: #666; }
    .btn-action.secondary:hover { background: #555; }
    .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Modals */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 16px;
    }
    .modal {
      background: #fff; border-radius: var(--radius); padding: 24px;
      width: 100%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow-y: auto;
    }
    .modal h3 { font-size: 1.1rem; }
    .modal label { font-weight: 600; display: block; margin-bottom: 4px; font-size: 0.9rem; }
    .modal input, .modal select {
      width: 100%; padding: 10px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 0.95rem;
    }
    .modal .hint { font-size: 0.8rem; color: var(--text-light); margin-top: 4px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 8px; }

    .btn {
      padding: 10px 18px; border: none; border-radius: 8px;
      cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s;
    }
    .btn-cancel { background: #eee; color: #333; }
    .btn-cancel:hover { background: #ddd; }
    .btn-save { background: var(--red); color: #fff; }
    .btn-save:hover { background: var(--red-hover); }
    .btn-danger { background: #c00; color: #fff; }
    .btn-danger:hover { background: #a00; }

    /* Arborescence de sélection d'objets (mode "liste de courses") */
    .tree-view {
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #eee;
      border-radius: 8px;
      background: #fafafa;
    }
    .tree-node {
      user-select: none;
    }
    .tree-node-header {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.15s;
    }
    .tree-node-header:hover { background: #f0f0f0; }
    .tree-node-header.inv-header { background: #f5f5f5; font-weight: 600; }
    .tree-node-header.cat-header { padding-left: 30px; background: #fafafa; }
    .tree-node-header.subcat-header { padding-left: 50px; background: #f7f5f2; }
    .tree-node-header.obj-header { padding-left: 70px; cursor: pointer; }
    .tree-node-header.obj-header:hover { background: #e8f5e9; }
    .tree-node-header .arrow {
      font-size: 0.8rem;
      transition: transform 0.2s;
      display: inline-block;
      width: 14px;
    }
    .tree-node-header .arrow.expanded { transform: rotate(90deg); }
    .tree-node-children { display: none; }
    .tree-node-children.expanded { display: block; }
    .tree-node-label { flex: 1; }
    .tree-node-qty {
      font-size: 0.75rem;
      background: #f0f0f0;
      padding: 2px 8px;
      border-radius: 8px;
      color: var(--text-light);
    }
    .tree-node.selected { background: #e8f5e9; }
    .tree-node.selected .tree-node-header { background: #c8e6c9; }
    .tree-add-btn {
      background: var(--red);
      color: #fff;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .tree-add-btn:hover { background: var(--red-hover); }

    /* Panier (objets sélectionnés) */
    .cart-panel {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: #fff;
      border-radius: 6px;
      margin-bottom: 6px;
      gap: 8px;
      font-size: 0.85rem;
    }
    .cart-item:last-child { margin-bottom: 0; }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name { font-weight: 600; }
    .cart-item-path { font-size: 0.75rem; color: var(--text-light); }
    .cart-item-qty {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .cart-item-qty input {
      width: 50px;
      padding: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-align: center;
      font-size: 0.85rem;
    }
    .cart-item-remove {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 1rem;
      padding: 0 4px;
    }

    /* Empty */
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }

    /* Loading */
    .loading { text-align: center; padding: 20px; color: var(--text-light); }

    /* Mark */
    mark { background: #fff59d; padding: 0 2px; border-radius: 2px; }

    @media (max-width: 480px) {
      .header { flex-direction: column; align-items: flex-start; }
      .header-buttons { width: 100%; justify-content: flex-end; }
      .list-item { flex-direction: column; align-items: flex-start; }
      .qty-controls { align-self: flex-end; }
      .action-buttons { flex-direction: column; }
      .btn-action { width: 100%; }
      .tree-node-header.cat-header { padding-left: 20px; }
      .tree-node-header.subcat-header { padding-left: 30px; }
      .tree-node-header.obj-header { padding-left: 40px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <span style="font-weight: 600;">📦 Utilisation des inventaires</span>
      </div>
      <div class="header-buttons">
        <button class="btn-back" id="btn-home">← Menu</button>
        <button class="btn-logout" id="btn-logout">Déconnexion</button>
      </div>
    </div>

    <!-- Recherche + sélection inventaires -->
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="🔍 Rechercher un objet, une catégorie ou un inventaire...">
      <div>
        <label style="font-size:0.85rem;color:var(--text-light);margin-bottom:6px;display:block;">Inventaires à utiliser :</label>
        <div class="inv-selector" id="inv-selector"></div>
      </div>
    </div>

    <!-- Contenu -->
    <div id="content">
      <div class="loading">Chargement...</div>
    </div>

    <!-- Boutons d'action -->
    <div class="action-buttons" id="action-buttons" style="display:none;">
      <button class="btn-action primary" id="btn-add-usage">➕ Ajouter du matériel utilisé</button>
      <button class="btn-action success" id="btn-rearm">🔄 Réarmer les inventaires</button>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal" id="modal-content"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, deleteUser } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, getDocs, collection, setDoc, updateDoc, deleteDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA1V3UybXWyyMmO9fBH7jhuVUSFL3mDBPo",
      authDomain: "crf--thot.firebaseapp.com",
      projectId: "crf--thot",
      storageBucket: "crf--thot.firebasestorage.app",
      messagingSenderId: "242106713414",
      appId: "1:242106713414:web:76f4c6977264539ef85147",
      measurementId: "G-NF6W8FS69P"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const USAGE_COLLECTION = 'UT';

    let currentUser = null;
    let userRole = null;

    // Données
    let inventories = [];
    let usages = [];
    let unsubscribeUsages = null;

    // Sélection des inventaires (filtre)
    let selectedInventories = [];
    let allInventoriesSelected = true;

    // État de réarmement
    let rearmMode = false;
    let rearmChecked = {};

    // DOM
    const contentEl = document.getElementById('content');
    const searchInput = document.getElementById('search-input');
    const invSelector = document.getElementById('inv-selector');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalContent = document.getElementById('modal-content');
    const actionButtons = document.getElementById('action-buttons');
    const btnAddUsage = document.getElementById('btn-add-usage');
    const btnRearm = document.getElementById('btn-rearm');

    // ===== AUTH =====
    onAuthStateChanged(auth, async (user) => {
      if (!user) { redirectToLogin(); return; }
      const nivol = user.displayName;
      if (!nivol) { await deleteUser(user).catch(() => {}); redirectToLogin(); return; }

      try {
        const adminSnap = await getDoc(doc(db, 'A', nivol));
        if (adminSnap.exists()) {
          userRole = 'admin';
          currentUser = { nivol, nom: adminSnap.data().I || 'Inconnu', fonction: adminSnap.data().F || '' };
        } else {
          const userSnap = await getDoc(doc(db, 'U', nivol));
          if (userSnap.exists()) {
            userRole = 'user';
            currentUser = { nivol, nom: userSnap.data().I || 'Inconnu' };
          } else {
            await deleteUser(user).catch(() => {});
            redirectToLogin();
            return;
          }
        }

        document.getElementById('btn-home').onclick = () => {
          window.location.href = userRole === 'admin' ? '../admin.html' : '../user.html';
        };

        await loadInventories();
        loadSelectedInventoriesFromUrl();
        renderInventorySelector();
        setupRealtimeUsages();
        renderMain();

      } catch (err) {
        console.error(err);
        if (auth.currentUser) await deleteUser(auth.currentUser).catch(() => {});
        redirectToLogin();
      }
    });

    function redirectToLogin() {
      const currentUrl = encodeURIComponent(window.location.href);
      window.location.href = `../login.html?redirect=${currentUrl}`;
    }

    document.getElementById('btn-logout').addEventListener('click', async () => {
      const user = auth.currentUser;
      if (user) { await deleteUser(user).catch(() => {}); window.location.href = '../login.html'; }
    });

    // ===== SÉLECTION INVENTAIRES VIA URL =====
    function loadSelectedInventoriesFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const invParam = params.get('inv');
      if (invParam) {
        selectedInventories = invParam.split(',').filter(Boolean);
        allInventoriesSelected = selectedInventories.length === 0;
      } else {
        // Par défaut : tous sélectionnés
        selectedInventories = [];
        allInventoriesSelected = true;
      }
    }

    function updateUrlWithSelectedInventories() {
      const params = new URLSearchParams(window.location.search);
      if (allInventoriesSelected || selectedInventories.length === 0) {
        params.delete('inv');
      } else {
        params.set('inv', selectedInventories.join(','));
      }
      const newUrl = params.toString()
        ? `${window.location.pathname}?${params.toString()}`
        : window.location.pathname;
      window.history.replaceState({}, '', newUrl);
    }

    // ===== CHARGEMENT INVENTAIRES =====
    async function loadInventories() {
      try {
        const snap = await getDocs(collection(db, 'I'));
        inventories = [];
        snap.forEach(d => {
          const data = d.data();
          inventories.push({
            id: d.id,
            nom: data.nom || d.id,
            objets: data.objets || {}
          });
        });
        inventories.sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
      } catch (e) { console.error(e); }
    }

    // ===== RENDU SÉLECTEUR INVENTAIRES =====
    function renderInventorySelector() {
      invSelector.innerHTML = '';

      // Chip "Tous"
      const allChip = document.createElement('div');
      allChip.className = 'inv-chip' + (allInventoriesSelected ? ' selected' : '');
      allChip.textContent = 'Tous';
      allChip.addEventListener('click', () => {
        allInventoriesSelected = true;
        selectedInventories = [];
        updateUrlWithSelectedInventories();
        renderInventorySelector();
        renderMain();
      });
      invSelector.appendChild(allChip);

      // Chips par inventaire
      inventories.forEach(inv => {
        const chip = document.createElement('div');
        const isSelected = !allInventoriesSelected && selectedInventories.includes(inv.id);
        chip.className = 'inv-chip' + (isSelected ? ' selected' : '');
        chip.textContent = inv.nom;
        chip.addEventListener('click', () => {
          allInventoriesSelected = false;
          if (selectedInventories.includes(inv.id)) {
            selectedInventories = selectedInventories.filter(i => i !== inv.id);
          } else {
            selectedInventories.push(inv.id);
          }
          if (selectedInventories.length === 0) {
            allInventoriesSelected = true;
          }
          updateUrlWithSelectedInventories();
          renderInventorySelector();
          renderMain();
        });
        invSelector.appendChild(chip);
      });
    }

    // Vérifier si un inventaire est sélectionné pour la recherche
    function isInventoryActive(invId) {
      if (allInventoriesSelected) return true;
      return selectedInventories.includes(invId);
    }

    // ===== TEMPS RÉEL USAGES =====
    function setupRealtimeUsages() {
      if (unsubscribeUsages) unsubscribeUsages();
      unsubscribeUsages = onSnapshot(collection(db, USAGE_COLLECTION), (snap) => {
        usages = [];
        snap.forEach(d => {
          usages.push({ id: d.id, ...d.data() });
        });
        usages.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
        if (rearmMode) renderRearmMode();
        else renderUsageList();
      }, (err) => {
        console.error('Realtime error:', err);
      });
    }

    // ===== HELPERS =====
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('fr-FR');
    }

    function getInventoryName(invId) {
      const inv = inventories.find(i => i.id === invId);
      return inv ? inv.nom : invId;
    }

    function isSubCategory(item) {
      return item && typeof item === 'object' && item._sub === true;
    }

    // ===== RENDU PRINCIPAL =====
    function renderMain() {
      actionButtons.style.display = 'flex';

      if (rearmMode) {
        renderRearmMode();
        return;
      }

      renderUsageList();
    }

    function renderUsageList() {
      const search = (searchInput.value || '').toLowerCase().trim();

      // Filtrer les usages
      const filteredUsages = usages.filter(u => {
        if (!isInventoryActive(u.inventaireId)) return false;
        if (!search) return true;
        const invName = getInventoryName(u.inventaireId).toLowerCase();
        const objName = (u.objetNom || '').toLowerCase();
        return invName.includes(search) || objName.includes(search);
      });

      // Regrouper par objet (inventaire + path)
      const grouped = {};
      filteredUsages.forEach(u => {
        const key = `${u.inventaireId}|${u.path}`;
        if (!grouped[key]) {
          grouped[key] = {
            inventaireId: u.inventaireId,
            inventaireNom: getInventoryName(u.inventaireId),
            path: u.path,
            objetNom: u.objetNom,
            quantite: 0,
            usages: []
          };
        }
        grouped[key].quantite += u.quantite || 0;
        grouped[key].usages.push(u);
      });

      const items = Object.values(grouped);

      let html = `
        <div class="section">
          <div class="section-header">
            <span>📋 Matériel utilisé (à réarmer)</span>
            <span class="badge warning">${items.length} objet(s)</span>
          </div>
      `;

      if (items.length === 0) {
        html += `<div class="empty-state"><div class="icon">📦</div><p>Aucun matériel utilisé pour le moment.</p></div>`;
      } else {
        html += '<ul class="list">';
        items.forEach(item => {
          html += `
            <li class="list-item">
              <div class="user-info">
                <div class="user-avatar">${escapeHtml(item.inventaireNom.charAt(0).toUpperCase())}</div>
                <div>
                  <div class="user-name">${escapeHtml(item.objetNom)} ×${item.quantite}</div>
                  <div class="user-nivol">📋 ${escapeHtml(item.inventaireNom)} · ${escapeHtml(item.path)}</div>
                </div>
              </div>
              <span class="badge warning">À réarmer</span>
            </li>
          `;
        });
        html += '</ul>';
      }
      html += '</div>';

      contentEl.innerHTML = html;

      if (items.length === 0) {
        btnRearm.disabled = true;
        btnRearm.style.opacity = '0.5';
        btnRearm.style.cursor = 'not-allowed';
      } else {
        btnRearm.disabled = false;
        btnRearm.style.opacity = '1';
        btnRearm.style.cursor = 'pointer';
      }
    }

    // ===== MODE RÉARMEMENT =====
    function renderRearmMode() {
      // Regrouper les usages par objet, uniquement pour les inventaires actifs
      const grouped = {};
      usages.filter(u => isInventoryActive(u.inventaireId)).forEach(u => {
        const key = `${u.inventaireId}|${u.path}`;
        if (!grouped[key]) {
          grouped[key] = {
            inventaireId: u.inventaireId,
            inventaireNom: getInventoryName(u.inventaireId),
            path: u.path,
            objetNom: u.objetNom,
            quantite: 0,
            usageIds: []
          };
        }
        grouped[key].quantite += u.quantite || 0;
        grouped[key].usageIds.push(u.id);
      });

      const items = Object.values(grouped);
      const checkedCount = Object.keys(rearmChecked).filter(k => rearmChecked[k]).length;

      let html = `
        <div class="section">
          <div class="section-header">
            <span>🔄 Réarmer les inventaires</span>
            <span class="badge ok">${checkedCount}/${items.length} réarmés</span>
          </div>
          <div style="padding:12px 18px;background:#fff8f0;border-bottom:1px solid #f0f0f0;font-size:0.85rem;color:#666;">
            Cochez chaque objet que vous avez réarmé. Les objets non cochés seront marqués comme <strong>absents</strong>.
          </div>
          <ul class="list" id="rearm-list">
      `;

      items.forEach(item => {
        const key = `${item.inventaireId}|${item.path}`;
        const checked = rearmChecked[key] ? 'checked' : '';
        html += `
          <li class="list-item" data-key="${escapeHtml(key)}">
            <div class="user-info" style="cursor:pointer;flex:1;">
              <input type="checkbox" class="rearm-checkbox" data-key="${escapeHtml(key)}" ${checked} style="width:24px;height:24px;cursor:pointer;flex-shrink:0;">
              <div style="margin-left:10px;">
                <div class="user-name">${escapeHtml(item.objetNom)} ×${item.quantite}</div>
                <div class="user-nivol">📋 ${escapeHtml(item.inventaireNom)} · ${escapeHtml(item.path)}</div>
              </div>
            </div>
          </li>
        `;
      });

      html += `
          </ul>
        </div>
        <div class="action-buttons" style="margin-top:12px;">
          <button class="btn-action secondary" id="btn-cancel-rearm">✖ Annuler</button>
          <button class="btn-action success" id="btn-validate-rearm">✅ Valider le réarmement</button>
        </div>
      `;

      contentEl.innerHTML = html;
      actionButtons.style.display = 'none';

      document.querySelectorAll('.rearm-checkbox').forEach(cb => {
        cb.addEventListener('change', (e) => {
          const key = cb.dataset.key;
          rearmChecked[key] = cb.checked;
          const total = document.querySelectorAll('.rearm-checkbox').length;
          const checked = document.querySelectorAll('.rearm-checkbox:checked').length;
          const badge = document.querySelector('.section-header .badge');
          if (badge) badge.textContent = `${checked}/${total} réarmés`;
        });
      });

      document.getElementById('btn-cancel-rearm').addEventListener('click', () => {
        rearmMode = false;
        rearmChecked = {};
        renderMain();
      });

      document.getElementById('btn-validate-rearm').addEventListener('click', () => {
        validateRearm(grouped);
      });
    }

    // ===== VALIDATION RÉARMEMENT =====
    async function validateRearm(grouped) {
      const items = Object.values(grouped);
      if (items.length === 0) return;

      const missingItems = items.filter(item => {
        const key = `${item.inventaireId}|${item.path}`;
        return !rearmChecked[key];
      });

      const message = missingItems.length > 0
        ? `${missingItems.length} objet(s) non réarmé(s) seront marqués comme <strong>absents</strong>.`
        : 'Tous les objets ont été réarmés.';

      modalContent.innerHTML = `
        <h3>Confirmer le réarmement</h3>
        <p>${message}</p>
        ${missingItems.length > 0 ? `
          <div style="background:#fff0f0;padding:12px;border-radius:8px;max-height:200px;overflow-y:auto;font-size:0.85rem;">
            ${missingItems.map(i => `<div style="padding:4px 0;border-bottom:1px solid #f5e5e5;">❌ ${escapeHtml(i.objetNom)} ×${i.quantite} (${escapeHtml(i.inventaireNom)})</div>`).join('')}
          </div>
        ` : ''}
        <div class="modal-actions">
          <button class="btn btn-cancel" id="modal-cancel">Annuler</button>
          <button class="btn btn-save" id="modal-confirm">Confirmer</button>
        </div>
      `;
      modalOverlay.style.display = 'flex';

      document.getElementById('modal-cancel').addEventListener('click', closeModal);
      document.getElementById('modal-confirm').addEventListener('click', async () => {
        try {
          const invIds = new Set(items.map(i => i.inventaireId));

          for (const invId of invIds) {
            const invItems = items.filter(i => i.inventaireId === invId);
            const invMissing = invItems.filter(i => !rearmChecked[`${i.inventaireId}|${i.path}`]);

            if (invMissing.length === 0) continue;

            const manquantsSnap = await getDoc(doc(db, 'I', invId));
            const currentManquants = manquantsSnap.data().manquants || [];

            const newEntries = invMissing.map(i => `${i.objetNom} (${i.path})`);
            const newManquants = [...new Set([...currentManquants, ...newEntries])];

            await updateDoc(doc(db, 'I', invId), { manquants: newManquants });
          }

          // Supprimer tous les usages des inventaires actifs
          for (const u of usages) {
            if (isInventoryActive(u.inventaireId)) {
              await deleteDoc(doc(db, USAGE_COLLECTION, u.id));
            }
          }

          rearmMode = false;
          rearmChecked = {};
          closeModal();
          renderMain();

        } catch (e) {
          console.error(e);
          alert('Erreur : ' + e.message);
        }
      });
    }

    // ===== BOUTONS D'ACTION =====
    btnAddUsage.addEventListener('click', () => openAddUsageModal());

    btnRearm.addEventListener('click', () => {
      if (usages.filter(u => isInventoryActive(u.inventaireId)).length === 0) return;
      rearmMode = true;
      rearmChecked = {};
      renderMain();
    });

    // ===== RECHERCHE =====
    searchInput.addEventListener('input', () => {
      if (!rearmMode) renderUsageList();
    });

    // ===== MODAL AJOUT USAGE (arborescence + panier) =====
    let cart = {}; // { "invId|path": { inventaireId, path, objetNom, quantite } }

    function openAddUsageModal() {
      cart = {};
      // Inventaires actifs uniquement
      const activeInvs = inventories.filter(inv => isInventoryActive(inv.id));

      modalContent.innerHTML = `
        <h3>➕ Ajouter du matériel utilisé</h3>
        <div>
          <label>Rechercher</label>
          <input type="text" id="modal-search" placeholder="Rechercher un objet, une catégorie ou un inventaire..." autofocus>
        </div>
        <div style="max-height:350px;overflow-y:auto;border:1px solid #eee;border-radius:8px;background:#fff;" id="modal-tree-view">
          ${renderTreeView(activeInvs, '')}
        </div>
        <div>
          <label>Objets sélectionnés (${Object.keys(cart).length})</label>
          <div class="cart-panel" id="modal-cart">
            <div style="text-align:center;color:#999;font-size:0.85rem;padding:12px;">Aucun objet sélectionné</div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="modal-cancel">Annuler</button>
          <button class="btn btn-save" id="modal-save" disabled>Ajouter tout</button>
        </div>
      `;
      modalOverlay.style.display = 'flex';

      const modalSearch = document.getElementById('modal-search');
      const treeView = document.getElementById('modal-tree-view');

      modalSearch.addEventListener('input', () => {
        const q = modalSearch.value.toLowerCase().trim();
        treeView.innerHTML = renderTreeView(activeInvs, q);
        attachTreeEvents(activeInvs);
      });

      document.getElementById('modal-cancel').addEventListener('click', closeModal);
      document.getElementById('modal-save').addEventListener('click', () => {
        saveCartToFirestore();
      });

      attachTreeEvents(activeInvs);
      updateCartUI();
    }

    // Rendu de l'arborescence (inventaires > catégories > sous-catégories > objets)
    // Si searchQuery est fourni, on ne garde que les branches contenant des objets correspondants
    function renderTreeView(activeInvs, searchQuery) {
      const q = (searchQuery || '').toLowerCase().trim();
      let html = '';

      activeInvs.forEach(inv => {
        const invMatches = q && inv.nom.toLowerCase().includes(q);

        // Filtrer récursivement
        const filteredTree = filterTree(inv.objets, q, invMatches);
        if (Object.keys(filteredTree).length === 0) return;

        html += renderTreeNode(inv.id, inv.nom, filteredTree, '', 0);
      });

      if (!html) {
        html = '<div style="padding:20px;text-align:center;color:#999;">Aucun résultat.</div>';
      }

      return html;
    }

    // Filtre récursif : garde les objets qui matchent ou les branches contenant des matches
    function filterTree(objets, q, forceInclude) {
      const result = {};
      Object.keys(objets).forEach(key => {
        if (key === '_sub') return;
        const item = objets[key];

        if (item && typeof item === 'object') {
          if (item._sub === true) {
            const filteredSub = filterTree(item, q, forceInclude);
            if (Object.keys(filteredSub).length > 0) {
              result[key] = { ...filteredSub, _sub: true };
            }
          } else if (item.q !== undefined) {
            // C'est un objet
            if (forceInclude || !q || key.toLowerCase().includes(q)) {
              result[key] = item;
            }
          }
        }
      });
      return result;
    }

    // Rendu récursif d'un nœud
    function renderTreeNode(invId, invName, objets, path, depth) {
      // depth = niveau de profondeur (0 = racine catégorie, 1 = sous-cat, ...)
      let html = '';

      Object.keys(objets).forEach(key => {
        if (key === '_sub') return;
        const item = objets[key];

        if (item && typeof item === 'object') {
          if (item._sub === true) {
            // Sous-catégorie
            const subPath = path ? `${path}.${key}` : key;
            const subKeys = Object.keys(item).filter(k => k !== '_sub');
            const headerClass = depth === 0 ? 'cat-header' : 'subcat-header';
            html += `
              <div class="tree-node" data-path="${escapeHtml(subPath)}">
                <div class="tree-node-header ${headerClass}" data-toggle="true">
                  <span class="arrow">▶</span>
                  <span class="tree-node-label">📂 ${escapeHtml(key)}</span>
                  <span class="tree-node-qty">${subKeys.length}</span>
                </div>
                <div class="tree-node-children">
                  ${renderTreeNode(invId, invName, item, subPath, depth + 1)}
                </div>
              </div>
            `;
          } else if (item.q !== undefined) {
            // C'est un objet
            const fullPath = path ? `${path}.${key}` : key;
            const cartKey = `${invId}|${fullPath}`;
            const inCart = !!cart[cartKey];
            html += `
              <div class="tree-node ${inCart ? 'selected' : ''}" data-obj-inv="${escapeHtml(invId)}" data-obj-path="${escapeHtml(fullPath)}" data-obj-nom="${escapeHtml(key)}">
                <div class="tree-node-header obj-header">
                  <span style="width:14px;"></span>
                  <span class="tree-node-label">${escapeHtml(key)}</span>
                  <span class="tree-node-qty">×${item.q}</span>
                  <button class="tree-add-btn" title="Ajouter" data-add-obj="true">+</button>
                </div>
              </div>
            `;
          }
        }
      });

      // Si on est au niveau racine, ajouter un wrapper pour l'inventaire
      if (depth === 0 && html) {
        return `
          <div class="tree-node" data-inv="${escapeHtml(invId)}">
            <div class="tree-node-header inv-header" data-toggle="true">
              <span class="arrow">▶</span>
              <span class="tree-node-label">📋 ${escapeHtml(invName)}</span>
            </div>
            <div class="tree-node-children">
              ${html}
            </div>
          </div>
        `;
      }
      return html;
    }

    // Attacher les événements de l'arborescence
    function attachTreeEvents(activeInvs) {
      // Toggles (expand/collapse)
      document.querySelectorAll('#modal-tree-view .tree-node-header[data-toggle="true"]').forEach(header => {
        header.addEventListener('click', (e) => {
          if (e.target.closest('button')) return;
          const node = header.closest('.tree-node');
          const children = node.querySelector(':scope > .tree-node-children');
          if (children) {
            children.classList.toggle('expanded');
            const arrow = header.querySelector('.arrow');
            if (arrow) arrow.classList.toggle('expanded');
          }
        });
      });

      // Ajout d'objets au panier
      document.querySelectorAll('#modal-tree-view .tree-add-btn[data-add-obj="true"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const node = btn.closest('.tree-node');
          const invId = node.dataset.objInv;
          const path = node.dataset.objPath;
          const nom = node.dataset.objNom;
          const key = `${invId}|${path}`;

          if (cart[key]) {
            cart[key].quantite++;
          } else {
            cart[key] = {
              inventaireId: invId,
              inventaireNom: getInventoryName(invId),
              path,
              objetNom: nom,
              quantite: 1
            };
          }
          node.classList.add('selected');
          updateCartUI();
        });
      });
    }

    // Mise à jour de l'UI du panier
    function updateCartUI() {
      const cartEl = document.getElementById('modal-cart');
      const saveBtn = document.getElementById('modal-save');
      const items = Object.values(cart);

      // Mettre à jour le label "Objets sélectionnés (N)"
      const label = document.querySelector('#modal-content label');
      const labels = document.querySelectorAll('#modal-content label');
      if (labels.length >= 2) {
        labels[labels.length - 1].textContent = `Objets sélectionnés (${items.length})`;
      }

      if (items.length === 0) {
        cartEl.innerHTML = '<div style="text-align:center;color:#999;font-size:0.85rem;padding:12px;">Aucun objet sélectionné</div>';
        if (saveBtn) {
          saveBtn.disabled = true;
          saveBtn.textContent = 'Ajouter tout';
        }
        return;
      }

      let html = '';
      items.forEach(item => {
        const key = `${item.inventaireId}|${item.path}`;
        html += `
          <div class="cart-item" data-cart-key="${escapeHtml(key)}">
            <div class="cart-item-info">
              <div class="cart-item-name">${escapeHtml(item.objetNom)}</div>
              <div class="cart-item-path">${escapeHtml(item.inventaireNom)} · ${escapeHtml(item.path)}</div>
            </div>
            <div class="cart-item-qty">
              <input type="number" min="1" value="${item.quantite}" data-qty-input="${escapeHtml(key)}">
            </div>
            <button class="cart-item-remove" data-remove="${escapeHtml(key)}" title="Retirer">✖</button>
          </div>
        `;
      });
      cartEl.innerHTML = html;

      // Événements quantité
      cartEl.querySelectorAll('[data-qty-input]').forEach(input => {
        input.addEventListener('change', (e) => {
          const key = input.dataset.qtyInput;
          const val = parseInt(input.value) || 1;
          if (cart[key]) {
            cart[key].quantite = Math.max(1, val);
          }
        });
      });

      // Événements retirer
      cartEl.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const key = btn.dataset.remove;
          delete cart[key];
          // Retirer la classe selected
          const treeNode = document.querySelector(`#modal-tree-view .tree-node[data-obj-inv="${CSS.escape(key.split('|')[0])}"][data-obj-path="${CSS.escape(key.split('|').slice(1).join('|'))}"]`);
          if (treeNode) treeNode.classList.remove('selected');
          updateCartUI();
        });
      });

      if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.textContent = `Ajouter tout (${items.length})`;
      }
    }

    // Sauvegarde du panier dans Firestore
    async function saveCartToFirestore() {
      const items = Object.values(cart);
      if (items.length === 0) return;

      try {
        for (const item of items) {
          const usageRef = doc(collection(db, USAGE_COLLECTION));
          await setDoc(usageRef, {
            inventaireId: item.inventaireId,
            path: item.path,
            objetNom: item.objetNom,
            quantite: item.quantite,
            par: currentUser.nivol,
            nomPar: currentUser.nom,
            createdAt: new Date().toISOString()
          });
        }
        cart = {};
        closeModal();
      } catch (e) {
        alert('Erreur : ' + e.message);
      }
    }

    function closeModal() {
      modalOverlay.style.display = 'none';
      modalContent.innerHTML = '';
      cart = {};
    }

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });
  </script>
</body>
</html>
