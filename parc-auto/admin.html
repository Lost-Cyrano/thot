<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thot – Parc Auto (Admin)</title>
  <style>
    :root {
      --red: #e60000; --red-hover: #b30000; --bg: #f5f5f5; --card-bg: #fff;
      --border: #ddd; --text: #333; --text-light: #666; --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,.08); --ok: #4caf50; --warning: #f5a623;
      --danger: #e60000;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; padding: 16px; }
    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 16px; }
    .header { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; box-shadow: var(--shadow); }
    .header-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .header-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
    .btn-back { background: transparent; border: 1.5px solid #ccc; color: var(--text); }
    .btn-back:hover { background: #eee; }
    .btn-logout { background: transparent; color: var(--red); border: 1.5px solid var(--red); }
    .btn-logout:hover { background: var(--red); color: #fff; }
    .btn-add { background: var(--red); color: #fff; }
    .btn-add:hover { background: var(--red-hover); }
    .btn-save { background: var(--ok); color: #fff; }
    .btn-save:hover { background: #388e3c; }
    .btn-danger { background: #c00; color: #fff; }
    .btn-danger:hover { background: #a00; }
    .btn-cancel { background: #eee; color: #333; }
    .btn-cancel:hover { background: #ddd; }
    .btn-sm { padding: 6px 12px; font-size: 0.85rem; border-radius: 6px; }
    .btn-icon { background: none; border: 1.5px solid #ccc; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.95rem; transition: all 0.2s; }
    .btn-icon:hover { background: #f0f0f0; }
    .btn-icon.delete:hover { color: var(--red); border-color: var(--red); background: #fff0f0; }

    /* Selector */
    .selector-bar { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; box-shadow: var(--shadow); }
    .selector-bar select { padding: 10px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.95rem; flex: 1; min-width: 200px; }

    /* Cards */
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 16px; }
    .card-header { padding: 14px 18px; background: #fafafa; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .card-body { padding: 18px; }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .info-item { display: flex; flex-direction: column; gap: 2px; }
    .info-label { font-size: 0.8rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; }
    .info-value { font-weight: 600; font-size: 1rem; }
    .info-value.editable { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge { font-size: 0.75rem; background: #f0f0f0; padding: 3px 8px; border-radius: 10px; color: var(--text-light); white-space: nowrap; }
    .badge.ok { background: #e8f5e9; color: #2e7d32; }
    .badge.warning { background: #fff8f0; color: var(--warning); }
    .badge.danger { background: #fff0f0; color: var(--danger); }

    /* Lists */
    .list { list-style: none; }
    .list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid #f0f0f0; flex-wrap: wrap; gap: 8px; }
    .list-item:last-child { border-bottom: none; }
    .list-item-main { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
    .list-item-title { font-weight: 600; font-size: 0.95rem; }
    .list-item-sub { font-size: 0.8rem; color: var(--text-light); }
    .list-item-actions { display: flex; gap: 6px; flex-shrink: 0; }

    /* Empty state */
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal { background: #fff; border-radius: var(--radius); padding: 24px; width: 100%; max-width: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-size: 1.1rem; }
    .modal label { font-weight: 600; display: block; margin-bottom: 4px; font-size: 0.9rem; }
    .modal input, .modal select, .modal textarea { width: 100%; padding: 10px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.95rem; font-family: inherit; }
    .modal textarea { min-height: 80px; resize: vertical; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 8px; }

    /* Logs */
    .log-item { font-size: 0.8rem; color: var(--text-light); padding: 6px 0; border-bottom: 1px solid #f5f5f5; }
    .log-item:last-child { border-bottom: none; }

    /* QR */
    .qr-container { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; background: #fafafa; border-radius: 8px; margin-top: 12px; }
    .qr-container img, .qr-container canvas { max-width: 100%; height: auto; }

    /* Responsive */
    @media (max-width: 480px) {
      .header { flex-direction: column; align-items: flex-start; }
      .header-buttons { width: 100%; justify-content: flex-end; }
      .list-item { flex-direction: column; align-items: flex-start; }
      .list-item-actions { align-self: flex-end; }
      .info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <span style="font-weight: 600;">🚗 Parc Auto – Administration</span>
      </div>
      <div class="header-buttons">
        <button class="btn btn-back" id="btn-admin">← Administration</button>
        <button class="btn btn-logout" id="btn-logout">Déconnexion</button>
      </div>
    </div>

    <!-- Selector -->
    <div class="selector-bar">
      <select id="vehicle-select">
        <option value="">— Choisir un véhicule —</option>
      </select>
      <button class="btn btn-add btn-sm" id="btn-create-vehicle">+ Nouveau véhicule</button>
    </div>

    <!-- Content -->
    <div id="content">
      <div class="empty-state">
        <div class="icon">🚗</div>
        <p>Sélectionnez un véhicule pour gérer ses informations.</p>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" style="display: none;">
    <div class="modal" id="modal-content"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, deleteUser } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, getDocs, collection, setDoc, addDoc, updateDoc, deleteDoc, deleteField, query, orderBy } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA1V3UybXWyyMmO9fBH7jhuVUSFL3mDBPo",
      authDomain: "crf--thot.firebaseapp.com",
      projectId: "crf--thot",
      storageBucket: "crf--thot.firebasestorage.app",
      messagingSenderId: "242106713414",
      appId: "1:242106713414:web:76f4c6977264539ef85147",
      measurementId: "G-NF6W8FS69P"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentAdmin = null;
    let vehicles = [];
    let currentVehicleId = null;
    let currentVehicleData = null;

    const vehicleSelect = document.getElementById('vehicle-select');
    const contentEl = document.getElementById('content');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalContent = document.getElementById('modal-content');

    // Vérification connexion
    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = '../login.html'; return; }
      const nivol = user.displayName;
      if (!nivol) { await deleteUser(user).catch(() => {}); window.location.href = '../login.html'; return; }

      try {
        const adminSnap = await getDoc(doc(db, 'A', nivol));
        if (!adminSnap.exists()) {
          await deleteUser(user).catch(() => {});
          window.location.href = '../login.html';
          return;
        }
        currentAdmin = {
          nivol,
          nom: adminSnap.data().I || 'Inconnu',
          fonction: adminSnap.data().F || ''
        };
        await loadVehicles();
      } catch (err) {
        console.error(err);
        if (auth.currentUser) await deleteUser(auth.currentUser).catch(() => {});
        window.location.href = '../login.html';
      }
    });

    document.getElementById('btn-logout').addEventListener('click', async () => {
      const user = auth.currentUser;
      if (user) { await deleteUser(user).catch(() => {}); window.location.href = '../login.html'; }
    });

    document.getElementById('btn-admin').addEventListener('click', () => {
      window.location.href = '../admin.html';
    });

    document.getElementById('btn-create-vehicle').addEventListener('click', () => openCreateVehicleModal());

    vehicleSelect.addEventListener('change', () => {
      const id = vehicleSelect.value;
      if (id) selectVehicle(id);
      else {
        currentVehicleId = null;
        currentVehicleData = null;
        contentEl.innerHTML = '<div class="empty-state"><div class="icon">🚗</div><p>Sélectionnez un véhicule pour gérer ses informations.</p></div>';
      }
    });

    // ===== CHARGEMENT =====
    async function loadVehicles() {
      try {
        const snap = await getDocs(collection(db, 'ParcAuto'));
        vehicles = [];
        snap.forEach(d => {
          const data = d.data();
          vehicles.push({ id: d.id, ...data });
        });
        vehicles.sort((a, b) => (a.nom || a.immatriculation || a.id).localeCompare(b.nom || b.immatriculation || b.id, 'fr'));

        const currentVal = vehicleSelect.value;
        vehicleSelect.innerHTML = '<option value="">— Choisir un véhicule —</option>';
        vehicles.forEach(v => {
          const label = `${v.nom || ''} ${v.immatriculation ? '(' + v.immatriculation + ')' : ''}`.trim() || v.id;
          vehicleSelect.innerHTML += `<option value="${v.id}"${v.id === currentVal ? ' selected' : ''}>${escapeHtml(label)}</option>`;
        });

        if (currentVehicleId) {
          const still = vehicles.find(v => v.id === currentVehicleId);
          if (still) {
            currentVehicleData = still;
            renderVehicle();
          } else {
            currentVehicleId = null;
            currentVehicleData = null;
            contentEl.innerHTML = '<div class="empty-state"><p>Ce véhicule n\'existe plus.</p></div>';
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    function selectVehicle(id) {
      const v = vehicles.find(x => x.id === id);
      if (!v) return;
      currentVehicleId = id;
      currentVehicleData = v;
      renderVehicle();
    }

    // ===== HELPERS =====
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('fr-FR');
    }

    function getDateStatus(dateStr) {
      if (!dateStr) return null;
      const now = new Date();
      const date = new Date(dateStr);
      const diffDays = Math.ceil((date - now) / (1000 * 60 * 60 * 24));
      if (diffDays <= 0) return 'danger';
      if (diffDays <= 30) return 'warning';
      return 'ok';
    }

    function getDateBadge(dateStr) {
      if (!dateStr) return '<span class="badge">—</span>';
      const status = getDateStatus(dateStr);
      const formatted = new Date(dateStr).toLocaleDateString('fr-FR');
      const cls = status === 'danger' ? 'danger' : status === 'warning' ? 'warning' : 'ok';
      const label = status === 'danger' ? 'PÉRIMÉ' : status === 'warning' ? 'Proche' : 'OK';
      return `<span class="badge ${cls}">${formatted} · ${label}</span>`;
    }

    // ===== RENDU =====
    function renderVehicle() {
      if (!currentVehicleData) return;
      const v = currentVehicleData;

      // Header véhicule
      let html = `
        <div class="card">
          <div class="card-header">
            <span>🚗 ${escapeHtml(v.nom || v.immatriculation || v.id)}</span>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="btn-icon" id="btn-edit-vehicle" title="Modifier">✏️</button>
              <button class="btn-icon" id="btn-qr" title="QR Code">📱</button>
              <button class="btn-icon delete" id="btn-delete-vehicle" title="Supprimer">🗑️</button>
            </div>
          </div>
          <div class="card-body">
            <div class="info-grid">
              <div class="info-item"><span class="info-label">Immatriculation</span><span class="info-value">${escapeHtml(v.immatriculation || '—')}</span></div>
              <div class="info-item"><span class="info-label">Nom</span><span class="info-value">${escapeHtml(v.nom || '—')}</span></div>
              <div class="info-item"><span class="info-label">Type de carburant</span><span class="info-value">${escapeHtml(v.carburant || '—')}</span></div>
              <div class="info-item">
                <span class="info-label">Kilométrage</span>
                <span class="info-value editable">${v.kilometrage ?? '—'} km <button class="btn-sm btn-icon" id="btn-edit-km" title="Modifier">✏️</button></span>
              </div>
              <div class="info-item"><span class="info-label">Assurance</span><span class="info-value">${getDateBadge(v.assurance)}</span></div>
              <div class="info-item"><span class="info-label">Contrôle Technique</span><span class="info-value">${getDateBadge(v.controleTechnique)}</span></div>
            </div>
          </div>
        </div>
      `;

      // Nettoyage / désinfection
      html += `
        <div class="card">
          <div class="card-header">
            <span>🧽 Nettoyage & Désinfection</span>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button class="btn-sm btn-icon" id="btn-edit-clean-freq" title="Fréquence">⚙️</button>
            </div>
          </div>
          <div class="card-body">
            <div class="info-grid">
              <div class="info-item"><span class="info-label">Fréquence nettoyage</span><span class="info-value">${v.freqNettoyage ? v.freqNettoyage + ' jour(s)' : 'Non définie'}</span></div>
              <div class="info-item"><span class="info-label">Fréquence désinfection</span><span class="info-value">${v.freqDesinfection ? v.freqDesinfection + ' jour(s)' : 'Non définie'}</span></div>
              <div class="info-item"><span class="info-label">Dernier nettoyage</span><span class="info-value">${v.dernierNettoyage ? formatDate(v.dernierNettoyage) + ' par ' + escapeHtml(v.dernierNettoyagePar || '?') : 'Jamais'}</span></div>
              <div class="info-item"><span class="info-label">Dernière désinfection</span><span class="info-value">${v.derniereDesinfection ? formatDate(v.derniereDesinfection) + ' (' + escapeHtml(v.derniereDesinfectionType || '?') + ') par ' + escapeHtml(v.derniereDesinfectionPar || '?') : 'Jamais'}</span></div>
            </div>
          </div>
        </div>
      `;

      // Entretiens
      const entretiens = v.entretiens || [];
      html += `
        <div class="card">
          <div class="card-header">
            <span>🔧 Entretiens (${entretiens.length})</span>
            <button class="btn-sm btn-add" id="btn-add-entretien">+ Ajouter</button>
          </div>
          <ul class="list" id="entretiens-list">
            ${entretiens.length === 0 ? '<li class="empty-state" style="padding:20px;"><p>Aucun entretien enregistré.</p></li>' : ''}
            ${entretiens.slice().reverse().map((e, i) => {
              const realIdx = entretiens.length - 1 - i;
              return `
                <li class="list-item">
                  <div class="list-item-main">
                    <span class="list-item-title">${escapeHtml(e.type || '—')} ${e.description ? '· ' + escapeHtml(e.description) : ''}</span>
                    <span class="list-item-sub">
                      ${e.date ? 'Date : ' + new Date(e.date).toLocaleDateString('fr-FR') : 'Pas de date'}
                      ${e.recurrence ? ' · Récurrence : ' + escapeHtml(e.recurrence) : ''}
                      ${e.valide ? ' · <span class="badge ok">Validé</span>' : ' · <span class="badge warning">En attente</span>'}
                    </span>
                  </div>
                  <div class="list-item-actions">
                    ${!e.valide ? `<button class="btn-icon valider-entretien" data-idx="${realIdx}" title="Valider">✅</button>` : ''}
                    <button class="btn-icon edit-entretien" data-idx="${realIdx}" title="Modifier">✏️</button>
                    <button class="btn-icon delete delete-entretien" data-idx="${realIdx}" title="Supprimer">🗑️</button>
                  </div>
                </li>`;
            }).join('')}
          </ul>
        </div>
      `;

      // Incidents
      const incidents = v.incidents || [];
      html += `
        <div class="card">
          <div class="card-header"><span>⚠️ Incidents signalés (${incidents.length})</span></div>
          <ul class="list">
            ${incidents.length === 0 ? '<li class="empty-state" style="padding:20px;"><p>Aucun incident.</p></li>' : ''}
            ${incidents.slice().reverse().map(inc => {
              const prioCls = inc.priorite === 'Haute' ? 'danger' : inc.priorite === 'Moyenne' ? 'warning' : '';
              return `
                <li class="list-item">
                  <div class="list-item-main">
                    <span class="list-item-title">${escapeHtml(inc.titre || '—')} <span class="badge ${prioCls}">${escapeHtml(inc.priorite || '—')}</span></span>
                    <span class="list-item-sub">${escapeHtml(inc.description || '')}</span>
                    <span class="list-item-sub" style="font-size:0.75rem;color:#999;">${formatDate(inc.date)} · par ${escapeHtml(inc.par || '?')}</span>
                  </div>
                  <div class="list-item-actions">
                    <button class="btn-icon delete delete-incident" data-id="${escapeHtml(inc.id || '')}" title="Supprimer">🗑️</button>
                  </div>
                </li>`;
            }).join('')}
          </ul>
        </div>
      `;

      // Historique
      const logs = v.historique || [];
      html += `
        <div class="card">
          <div class="card-header"><span>📜 Historique (${logs.length})</span></div>
          <div class="card-body" style="max-height:300px;overflow-y:auto;">
            ${logs.length === 0 ? '<p style="color:#999;">Aucune activité.</p>' : logs.slice().reverse().map(l => `
              <div class="log-item">${formatDate(l.t)} — <strong>${escapeHtml(l.n || '?')}</strong> — ${escapeHtml(l.a || '')}</div>
            `).join('')}
          </div>
        </div>
      `;

      contentEl.innerHTML = html;
      attachVehicleEvents();
    }

    function attachVehicleEvents() {
      document.getElementById('btn-edit-vehicle')?.addEventListener('click', () => openEditVehicleModal());
      document.getElementById('btn-delete-vehicle')?.addEventListener('click', () => openDeleteVehicleModal());
      document.getElementById('btn-qr')?.addEventListener('click', () => openQRModal());
      document.getElementById('btn-edit-km')?.addEventListener('click', () => openEditKmModal());
      document.getElementById('btn-edit-clean-freq')?.addEventListener('click', () => openCleanFreqModal());
      document.getElementById('btn-add-entretien')?.addEventListener('click', () => openEntretienModal());

      document.querySelectorAll('.edit-entretien').forEach(btn => {
        btn.addEventListener('click', () => openEntretienModal(parseInt(btn.dataset.idx)));
      });
      document.querySelectorAll('.delete-entretien').forEach(btn => {
        btn.addEventListener('click', () => deleteEntretien(parseInt(btn.dataset.idx)));
      });
      document.querySelectorAll('.valider-entretien').forEach(btn => {
        btn.addEventListener('click', () => validerEntretien(parseInt(btn.dataset.idx)));
      });
      document.querySelectorAll('.delete-incident').forEach(btn => {
        btn.addEventListener('click', () => deleteIncident(btn.dataset.id));
      });
    }

    // ===== LOG =====
    async function addLog(action) {
      const log = { n: currentAdmin.nivol, t: new Date().toISOString(), a: action };
      try {
        const ref = doc(db, 'ParcAuto', currentVehicleId);
        const snap = await getDoc(ref);
        const logs = snap.data().historique || [];
        logs.push(log);
        await updateDoc(ref, { historique: logs.slice(-100) });
        if (currentVehicleData) currentVehicleData.historique = logs.slice(-100);
      } catch (e) { console.error('Log error:', e); }
    }

    // ===== MODALS VÉHICULE =====
    function openCreateVehicleModal() {
      modalContent.innerHTML = `
        <h3>Nouveau véhicule</h3>
        <div><label>Immatriculation</label><input type="text" id="m-immat" placeholder="AB-123-CD"></div>
        <div><label>Nom</label><input type="text" id="m-nom" placeholder="Nom du véhicule"></div>
        <div><label>Type de carburant</label>
          <select id="m-carburant">
            <option value="">— Choisir —</option>
            <option>Essence</option><option>Diesel</option><option>Électrique</option><option>Hybride</option><option>GPL</option>
          </select>
        </div>
        <div><label>Kilométrage initial</label><input type="number" id="m-km" value="0" min="0"></div>
        <div><label>Assurance (date d'échéance)</label><input type="date" id="m-assurance"></div>
        <div><label>Contrôle technique (date d'échéance)</label><input type="date" id="m-ct"></div>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="m-cancel">Annuler</button>
          <button class="btn btn-save" id="m-save">Créer</button>
        </div>`;
      modalOverlay.style.display = 'flex';
      document.getElementById('m-cancel').addEventListener('click', closeModal);
      document.getElementById('m-save').addEventListener('click', async () => {
        const immat = document.getElementById('m-immat').value.trim();
        const nom = document.getElementById('m-nom').value.trim();
        if (!immat) return alert('Immatriculation requise.');
        if (!nom) return alert('Nom requis.');

        const docId = immat.replace(/[^a-zA-Z0-9]/g, '_');
        const exists = await getDoc(doc(db, 'ParcAuto', docId));
        if (exists.exists()) return alert('Un véhicule avec cette immatriculation existe déjà.');

        const data = {
          immatriculation: immat,
          nom: nom,
          carburant: document.getElementById('m-carburant').value,
          kilometrage: parseInt(document.getElementById('m-km').value) || 0,
          assurance: document.getElementById('m-assurance').value || '',
          controleTechnique: document.getElementById('m-ct').value || '',
          entretiens: [],
          incidents: [],
          historique: [{ n: currentAdmin.nivol, t: new Date().toISOString(), a: `Création du véhicule "${nom}"` }]
        };
        try {
          await setDoc(doc(db, 'ParcAuto', docId), data);
          closeModal();
          await loadVehicles();
          vehicleSelect.value = docId;
          selectVehicle(docId);
        } catch (e) { alert('Erreur : ' + e.message); }
      });
    }

    function openEditVehicleModal() {
      const v = currentVehicleData;
      modalContent.innerHTML = `
        <h3>Modifier "${escapeHtml(v.nom)}"</h3>
        <div><label>Immatriculation</label><input type="text" id="m-immat" value="${escapeHtml(v.immatriculation || '')}"></div>
        <div><label>Nom</label><input type="text" id="m-nom" value="${escapeHtml(v.nom || '')}"></div>
        <div><label>Type de carburant</label>
          <select id="m-carburant">
            ${['Essence','Diesel','Électrique','Hybride','GPL'].map(c => `<option ${v.carburant === c ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
        </div>
        <div><label>Assurance (date d'échéance)</label><input type="date" id="m-assurance" value="${v.assurance || ''}"></div>
        <div><label>Contrôle technique (date d'échéance)</label><input type="date" id="m-ct" value="${v.controleTechnique || ''}"></div>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="m-cancel">Annuler</button>
          <button class="btn btn-save" id="m-save">Enregistrer</button>
        </div>`;
      modalOverlay.style.display = 'flex';
      document.getElementById('m-cancel').addEventListener('click', closeModal);
      document.getElementById('m-save').addEventListener('click', async () => {
        const immat = document.getElementById('m-immat').value.trim();
        const nom = document.getElementById('m-nom').value.trim();
        if (!immat || !nom) return alert('Immatriculation et nom requis.');
        try {
          await updateDoc(doc(db, 'ParcAuto', currentVehicleId), {
            immatriculation: immat,
            nom: nom,
            carburant: document.getElementById('m-carburant').value,
            assurance: document.getElementById('m-assurance').value || '',
            controleTechnique: document.getElementById('m-ct').value || ''
          });
          await addLog(`Modification des informations du véhicule`);
          closeModal();
          await loadVehicles();
        } catch (e) { alert('Erreur : ' + e.message); }
      });
    }

    function openDeleteVehicleModal() {
      const v = currentVehicleData;
      modalContent.innerHTML = `
        <h3>Supprimer le véhicule</h3>
        <p>Supprimer définitivement <strong>${escapeHtml(v.nom)}</strong> (${escapeHtml(v.immatriculation || '')}) ?</p>
        <p style="color:var(--red);font-weight:600;">Action irréversible.</p>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="m-cancel">Annuler</button>
          <button class="btn btn-danger" id="m-delete">Supprimer</button>
        </div>`;
      modalOverlay.style.display = 'flex';
      document.getElementById('m-cancel').addEventListener('click', closeModal);
      document.getElementById('m-delete').addEventListener('click', async () => {
        try {
          await deleteDoc(doc(db, 'ParcAuto', currentVehicleId));
          closeModal();
          currentVehicleId = null;
          currentVehicleData = null;
          await loadVehicles();
          vehicleSelect.value = '';
          contentEl.innerHTML = '<div class="empty-state"><p>Sélectionnez un véhicule.</p></div>';
        } catch (e) { alert('Erreur : ' + e.message); }
      });
    }

    function openEditKmModal() {
      const v = currentVehicleData;
      modalContent.innerHTML = `
        <h3>Modifier le kilométrage</h3>
        <div><label>Kilométrage (km)</label><input type="number" id="m-km" value="${v.kilometrage || 0}" min="0"></div>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="m-cancel">Annuler</button>
          <button class="btn btn-save" id="m-save">Enregistrer</button>
        </div>`;
      modalOverlay.style.display = 'flex';
      document.getElementById('m-cancel').addEventListener('click', closeModal);
      document.getElementById('m-save').addEventListener('click', async () => {
        const km = parseInt(document.getElementById('m-km').value) || 0;
        try {
          await updateDoc(doc(db, 'ParcAuto', currentVehicleId), { kilometrage: km });
          await addLog(`Kilométrage mis à jour : ${km} km`);
          closeModal();
          await loadVehicles();
        } catch (e) { alert('Erreur : ' + e.message); }
      });
    }

    function openCleanFreqModal() {
      const v = currentVehicleData;
      modalContent.innerHTML = `
        <h3>Fréquences de nettoyage / désinfection</h3>
        <div><label>Nettoyage tous les X jours</label><input type="number" id="m-freq-nett" value="${v.freqNettoyage || ''}" min="0" placeholder="Laisser vide pour désactiver"></div>
        <div><label>Désinfection tous les X jours</label><input type="number" id="m-freq-des" value="${v.freqDesinfection || ''}" min="0" placeholder="Laisser vide pour désactiver"></div>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="m-cancel">Annuler</button>
          <button class="btn btn-save" id="m-save">Enregistrer</button>
        </div>`;
      modalOverlay.style.display = 'flex';
      document.getElementById('m-cancel').addEventListener('click', closeModal);
      document.getElementById('m-save').addEventListener('click', async () => {
        const f1 = parseInt(document.getElementById('m-freq-nett').value) || 0;
        const f2 = parseInt(document.getElementById('m-freq-des').value) || 0;
        try {
          await updateDoc(doc(db, 'ParcAuto', currentVehicleId), {
            freqNettoyage: f1 > 0 ? f1 : deleteField(),
            freqDesinfection: f2 > 0 ? f2 : deleteField()
          });
          await addLog(`Fréquences mises à jour (nettoyage:${f1}j, désinfection:${f2}j)`);
          closeModal();
          await loadVehicles();
        } catch (e) { alert('Erreur : ' + e.message); }
      });
    }

    function openQRModal() {
      const v = currentVehicleData;
      // URL vers l'index user avec le paramètre vehicule
      const baseUrl = window.location.origin + window.location.pathname.replace(/\/admin\.html$/, '/') + 'index.html';
      const targetUrl = `${baseUrl}?vehicule=${encodeURIComponent(currentVehicleId)}`;

      modalContent.innerHTML = `
        <h3>QR Code du véhicule</h3>
        <p style="font-size:0.85rem;color:var(--text-light);">${escapeHtml(v.nom)} (${escapeHtml(v.immatriculation || '')})</p>
        <div class="qr-container" id="qr-box">
          <canvas id="qr-canvas"></canvas>
          <p style="font-size:0.8rem;color:#666;word-break:break-all;">${escapeHtml(targetUrl)}</p>
        </div>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="m-cancel">Fermer</button>
          <button class="btn btn-save" id="m-download">Télécharger</button>
        </div>`;
      modalOverlay.style.display = 'flex';

      // Génération du QR code via l'API Google Charts (simple, pas de dépendance)
      const canvas = document.getElementById('qr-canvas');
      const img = new Image();
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(targetUrl)}`;
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        canvas.width = 250; canvas.height = 250;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, 250, 250);
      };
      img.onerror = () => {
        // Fallback : afficher directement l'image
        document.getElementById('qr-box').innerHTML = `<img src="${qrApiUrl}" alt="QR Code" style="width:250px;height:250px;">`;
      };
      img.src = qrApiUrl;

      document.getElementById('m-cancel').addEventListener('click', closeModal);
      document.getElementById('m-download').addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = `qr-${v.immatriculation || currentVehicleId}.png`;
        link.href = qrApiUrl;
        link.target = '_blank';
        link.click();
      });
    }

    // ===== ENTRETIENS =====
    function openEntretienModal(editIdx = null) {
      const v = currentVehicleData;
      const isEdit = editIdx !== null;
      const e = isEdit ? v.entretiens[editIdx] : {};
      const types = ['Vidange', 'Contrôle technique', 'Révision générale', 'Pneus', 'Freins', 'Climatisation', 'Autre'];

      modalContent.innerHTML = `
        <h3>${isEdit ? 'Modifier' : 'Nouvel'} entretien</h3>
        <div><label>Date</label><input type="date" id="m-date" value="${e.date || ''}"></div>
        <div><label>Récurrence</label>
          <select id="m-recurrence">
            <option value="">— Aucune —</option>
            <option value="jour" ${e.recurrence === 'jour' ? 'selected' : ''}>En jours</option>
            <option value="kilometrage" ${e.recurrence === 'kilometrage' ? 'selected' : ''}>En kilométrage</option>
          </select>
        </div>
        <div><label>Type</label>
          <select id="m-type">
            ${types.map(t => `<option ${e.type === t ? 'selected' : ''}>${t}</option>`).join('')}
          </select>
        </div>
        <div id="m-desc-wrap" style="display:none;"><label>Description (type Autre)</label><input type="text" id="m-desc" value="${escapeHtml(e.description || '')}"></div>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="m-cancel">Annuler</button>
          <button class="btn btn-save" id="m-save">${isEdit ? 'Enregistrer' : 'Ajouter'}</button>
        </div>`;
      modalOverlay.style.display = 'flex';

      const typeSel = document.getElementById('m-type');
      const descWrap = document.getElementById('m-desc-wrap');
      const toggleDesc = () => { descWrap.style.display = typeSel.value === 'Autre' ? 'block' : 'none'; };
      typeSel.addEventListener('change', toggleDesc);
      toggleDesc();

      document.getElementById('m-cancel').addEventListener('click', closeModal);
      document.getElementById('m-save').addEventListener('click', async () => {
        const date = document.getElementById('m-date').value;
        const recurrence = document.getElementById('m-recurrence').value;
        const type = typeSel.value;
        const description = document.getElementById('m-desc').value.trim();

        const data = { date, recurrence, type, description: type === 'Autre' ? description : '' };
        try {
          let entretiens = v.entretiens ? [...v.entretiens] : [];
          if (isEdit) {
            entretiens[editIdx] = { ...entretiens[editIdx], ...data };
          } else {
            entretiens.push({ ...data, valide: false, cree: new Date().toISOString(), creePar: currentAdmin.nivol });
          }
          await updateDoc(doc(db, 'ParcAuto', currentVehicleId), { entretiens });
          await addLog(`${isEdit ? 'Modification' : 'Ajout'} entretien "${type}"`);
          closeModal();
          await loadVehicles();
        } catch (e) { alert('Erreur : ' + e.message); }
      });
    }

    async function validerEntretien(idx) {
      try {
        const entretiens = [...(currentVehicleData.entretiens || [])];
        entretiens[idx].valide = true;
        entretiens[idx].validePar = currentAdmin.nivol;
        entretiens[idx].valideDate = new Date().toISOString();
        await updateDoc(doc(db, 'ParcAuto', currentVehicleId), { entretiens });
        await addLog(`Validation de l'entretien "${entretiens[idx].type}"`);
        await loadVehicles();
      } catch (e) { alert('Erreur : ' + e.message); }
    }

    async function deleteEntretien(idx) {
      if (!confirm('Supprimer cet entretien ?')) return;
      try {
        const entretiens = [...(currentVehicleData.entretiens || [])];
        const removed = entretiens.splice(idx, 1)[0];
        await updateDoc(doc(db, 'ParcAuto', currentVehicleId), { entretiens });
        await addLog(`Suppression de l'entretien "${removed.type}"`);
        await loadVehicles();
      } catch (e) { alert('Erreur : ' + e.message); }
    }

    async function deleteIncident(incId) {
      if (!confirm('Supprimer cet incident ?')) return;
      try {
        const incidents = (currentVehicleData.incidents || []).filter(i => i.id !== incId);
        await updateDoc(doc(db, 'ParcAuto', currentVehicleId), { incidents });
        await addLog(`Suppression d'un incident`);
        await loadVehicles();
      } catch (e) { alert('Erreur : ' + e.message); }
    }

    function closeModal() {
      modalOverlay.style.display = 'none';
      modalContent.innerHTML = '';
    }
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
  </script>
</body>
</html>
