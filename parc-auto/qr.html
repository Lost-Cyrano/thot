<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thot – QR Code</title>
  <style>
    :root {
      --red: #e60000;
      --red-hover: #b30000;
      --bg: #f5f5f5;
      --card-bg: #ffffff;
      --border: #ddd;
      --text: #333;
      --text-light: #666;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --ok: #4caf50;
      --warning: #f5a623;
      --danger: #e60000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-weight: 600;
    }

    .btn-back {
      background: transparent;
      border: 1.5px solid #ccc;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .btn-back:hover { background: #eee; }

    .btn-logout {
      background: transparent;
      color: var(--red);
      border: 1.5px solid var(--red);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .btn-logout:hover { background: var(--red); color: #fff; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-header {
      padding: 14px 18px;
      background: #fafafa;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      text-align: center;
    }

    .card-body {
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .qr-container {
      background: #fff;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 250px;
      min-height: 250px;
    }

    .qr-container canvas,
    .qr-container img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .info-title {
      font-size: 1.2rem;
      font-weight: 700;
      text-align: center;
    }

    .info-subtitle {
      font-size: 0.9rem;
      color: var(--text-light);
      text-align: center;
    }

    .url-preview {
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.8rem;
      color: var(--text-light);
      word-break: break-all;
      text-align: center;
      font-family: monospace;
      width: 100%;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .btn {
      padding: 12px 22px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .btn-download {
      background: var(--ok);
      color: #fff;
    }

    .btn-download:hover { background: #388e3c; }

    .btn-print {
      background: var(--red);
      color: #fff;
    }

    .btn-print:hover { background: var(--red-hover); }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .error {
      background: #fff0f0;
      color: var(--danger);
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
    }

    .loader {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-light);
    }

    .loader-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Print */
    @media print {
      body { background: #fff; padding: 0; }
      .header, .actions, .url-preview, .btn-back, .btn-logout { display: none !important; }
      .card { border: none; box-shadow: none; }
      .card-header { background: #fff; }
    }

    @media (max-width: 480px) {
      .card-body { padding: 16px 12px; }
      .qr-container { min-width: 200px; min-height: 200px; padding: 12px; }
      .actions { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <span>📱 Génération de QR Code</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-back" id="btn-back">← Retour</button>
        <button class="btn-logout" id="btn-logout">Déconnexion</button>
      </div>
    </div>

    <div id="content">
      <div class="loader">
        <div class="loader-spinner"></div>
        <p>Chargement...</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, deleteUser } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA1V3UybXWyyMmO9fBH7jhuVUSFL3mDBPo",
      authDomain: "crf--thot.firebaseapp.com",
      projectId: "crf--thot",
      storageBucket: "crf--thot.firebasestorage.app",
      messagingSenderId: "242106713414",
      appId: "1:242106713414:web:76f4c6977264539ef85147",
      measurementId: "G-NF6W8FS69P"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentNivol = null;
    let userRole = null;

    const contentEl = document.getElementById('content');
    const btnBack = document.getElementById('btn-back');

    // Récupérer les paramètres de l'URL
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type'); // 'vehicule' ou 'inventaire'
    const id = urlParams.get('id');

    // Vérification connexion
    onAuthStateChanged(auth, async (user) => {
      if (!user) { redirectToLogin(); return; }
      currentNivol = user.displayName;
      if (!currentNivol) {
        await deleteUser(user).catch(() => {});
        redirectToLogin();
        return;
      }

      try {
        const adminSnap = await getDoc(doc(db, 'A', currentNivol));
        if (adminSnap.exists()) userRole = 'admin';
        else {
          const userSnap = await getDoc(doc(db, 'U', currentNivol));
          if (userSnap.exists()) userRole = 'user';
        }
      } catch (e) { userRole = 'user'; }

      // Vérifier que c'est un admin (les QR codes ne sont générés que par les admins)
      if (userRole !== 'admin') {
        contentEl.innerHTML = '<div class="error">⛔ Accès réservé aux administrateurs.</div>';
        return;
      }

      // Configurer le bouton retour
      updateBackButton();

      // Générer le QR code
      await generateQR();
    });

    function redirectToLogin() {
      const currentUrl = encodeURIComponent(window.location.href);
      window.location.href = `./login.html?redirect=${currentUrl}`;
    }

    function getHomeUrl() {
      return userRole === 'admin' ? './admin.html' : './user.html';
    }

    function updateBackButton() {
      // Retour vers la page admin du parc auto si type=vehicule, sinon vers l'accueil
      if (type === 'vehicule') {
        btnBack.onclick = () => { window.location.href = './parc-auto/admin.html'; };
        btnBack.textContent = '← Parc Auto';
      } else if (type === 'inventaire') {
        btnBack.onclick = () => { window.location.href = './admin.html'; };
        btnBack.textContent = '← Administration';
      } else {
        btnBack.onclick = () => { window.location.href = getHomeUrl(); };
        btnBack.textContent = '← Retour';
      }
    }

    document.getElementById('btn-logout').addEventListener('click', async () => {
      const user = auth.currentUser;
      if (user) {
        await deleteUser(user).catch(() => {});
        window.location.href = './login.html';
      }
    });

    // ===== GÉNÉRATION DU QR CODE =====
    async function generateQR() {
      if (!type || !id) {
        contentEl.innerHTML = '<div class="error">⚠️ Paramètres manquants : type et id sont requis.</div>';
        return;
      }

      try {
        let title = '';
        let subtitle = '';
        let targetUrl = '';
        let filename = '';

        if (type === 'vehicule') {
          // Récupérer les infos du véhicule
          const docSnap = await getDoc(doc(db, 'P', id));
          if (!docSnap.exists()) {
            contentEl.innerHTML = '<div class="error">⚠️ Véhicule introuvable.</div>';
            return;
          }
          const data = docSnap.data();
          title = data.n || data.im || id;
          subtitle = data.im ? `Immatriculation : ${data.im}` : '';

          // URL vers la page index utilisateur avec le paramètre vehicule
          const baseUrl = window.location.origin + window.location.pathname.replace(/\/qr\.html$/, '/') + 'parc-auto/index.html';
          targetUrl = `${baseUrl}?vehicule=${encodeURIComponent(id)}`;
          filename = `qr-vehicule-${(data.im || id).replace(/[^a-zA-Z0-9]/g, '-')}.png`;

        } else if (type === 'inventaire') {
          // Récupérer les infos de l'inventaire
          const docSnap = await getDoc(doc(db, 'I', id));
          if (!docSnap.exists()) {
            contentEl.innerHTML = '<div class="error">⚠️ Inventaire introuvable.</div>';
            return;
          }
          const data = docSnap.data();
          title = data.nom || id;
          subtitle = `Inventaire`;

          const baseUrl = window.location.origin + window.location.pathname.replace(/\/qr\.html$/, '/') + 'inventaire/';
          targetUrl = `${baseUrl}?inv=${encodeURIComponent(id)}`;
          filename = `qr-inventaire-${id.replace(/[^a-zA-Z0-9]/g, '-')}.png`;

        } else {
          contentEl.innerHTML = `<div class="error">⚠️ Type inconnu : "${type}".</div>`;
          return;
        }

        // Afficher l'interface
        renderQRUI(title, subtitle, targetUrl, filename);

      } catch (e) {
        console.error(e);
        contentEl.innerHTML = `<div class="error">Erreur : ${e.message}</div>`;
      }
    }

    function renderQRUI(title, subtitle, targetUrl, filename) {
      contentEl.innerHTML = `
        <div class="card">
          <div class="card-header">
            <div class="info-title">${escapeHtml(title)}</div>
            ${subtitle ? `<div class="info-subtitle">${escapeHtml(subtitle)}</div>` : ''}
          </div>
          <div class="card-body">
            <div class="qr-container" id="qr-box">
              <div class="loader">
                <div class="loader-spinner"></div>
              </div>
            </div>
            <div class="url-preview">${escapeHtml(targetUrl)}</div>
            <div class="actions">
              <button class="btn btn-download" id="btn-download" disabled>⬇️ Télécharger</button>
              <button class="btn btn-print" id="btn-print" disabled>🖨️ Imprimer</button>
            </div>
          </div>
        </div>
      `;

      // Générer le QR code via l'API QR Server
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(targetUrl)}`;
      const img = new Image();
      img.crossOrigin = 'anonymous';

      img.onload = () => {
        const qrBox = document.getElementById('qr-box');
        qrBox.innerHTML = '';
        qrBox.appendChild(img);

        // Activer les boutons
        document.getElementById('btn-download').disabled = false;
        document.getElementById('btn-print').disabled = false;

        // Bouton télécharger
        document.getElementById('btn-download').addEventListener('click', () => {
          const link = document.createElement('a');
          link.download = filename;
          link.href = qrApiUrl;
          link.target = '_blank';
          link.click();
        });

        // Bouton imprimer
        document.getElementById('btn-print').addEventListener('click', () => {
          window.print();
        });
      };

      img.onerror = () => {
        const qrBox = document.getElementById('qr-box');
        qrBox.innerHTML = '<div class="error">Erreur de génération du QR code.<br>Vérifiez votre connexion.</div>';
      };

      img.src = qrApiUrl;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>qr.html
