<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thot – Parc Auto</title>
  <style>
    :root {
      --red: #e60000;
      --red-hover: #b30000;
      --bg: #f5f5f5;
      --card-bg: #ffffff;
      --border: #ddd;
      --text: #333;
      --text-light: #666;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --ok: #4caf50;
      --warning: #f5a623;
      --danger: #e60000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    .header-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .btn-back {
      background: transparent;
      border: 1.5px solid #ccc;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-back:hover { background: #eee; }

    .btn-logout {
      background: transparent;
      color: var(--red);
      border: 1.5px solid var(--red);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-logout:hover { background: var(--red); color: #fff; }

    .btn-add {
      background: var(--red);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .btn-add:hover { background: var(--red-hover); }

    /* Sélecteur */
    .selector-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      box-shadow: var(--shadow);
    }

    .selector-bar select {
      padding: 10px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      flex: 1;
      min-width: 200px;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 16px;
    }

    .card-header {
      padding: 14px 18px;
      background: #fafafa;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card-body { padding: 18px; }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .info-item { display: flex; flex-direction: column; gap: 2px; }
    .info-label { font-size: 0.8rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; }
    .info-value { font-weight: 600; font-size: 1rem; }
    .info-value.editable { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .badge {
      font-size: 0.75rem;
      background: #f0f0f0;
      padding: 3px 8px;
      border-radius: 10px;
      color: var(--text-light);
      white-space: nowrap;
    }
    .badge.ok { background: #e8f5e9; color: #2e7d32; }
    .badge.warning { background: #fff8f0; color: var(--warning); }
    .badge.danger { background: #fff0f0; color: var(--danger); }

    /* Lists */
    .list { list-style: none; }

    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid #f0f0f0;
      flex-wrap: wrap;
      gap: 8px;
    }

    .list-item:last-child { border-bottom: none; }
    .list-item-main { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
    .list-item-title { font-weight: 600; font-size: 0.95rem; }
    .list-item-sub { font-size: 0.8rem; color: var(--text-light); }
    .list-item-actions { display: flex; gap: 6px; flex-shrink: 0; }

    /* Action buttons */
    .action-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .action-btn {
      flex: 1;
      min-width: 160px;
      background: var(--red);
      color: #fff;
      border: none;
      padding: 14px 20px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.2s;
      text-align: center;
    }

    .action-btn:hover { background: var(--red-hover); transform: translateY(-1px); }

    .action-btn.clean {
      background: #2196f3;
    }
    .action-btn.clean:hover { background: #1976d2; }

    .action-btn.disinfect {
      background: var(--ok);
    }
    .action-btn.disinfect:hover { background: #388e3c; }

    .action-btn.incident {
      background: var(--warning);
    }
    .action-btn.incident:hover { background: #e09600; }

    /* Empty state */
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }

    /* Logs */
    .logs-section { margin-top: 8px; }
    .logs-section summary { cursor: pointer; font-weight: 600; color: var(--text-light); font-size: 0.9rem; padding: 8px 0; }
    .log-item { font-size: 0.8rem; color: var(--text-light); padding: 6px 0; border-bottom: 1px solid #f5f5f5; }
    .log-item:last-child { border-bottom: none; }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal {
      background: #fff;
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h3 { font-size: 1.1rem; }
    .modal label { font-weight: 600; display: block; margin-bottom: 4px; font-size: 0.9rem; }
    .modal input, .modal select, .modal textarea {
      width: 100%;
      padding: 10px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
    }
    .modal textarea { min-height: 80px; resize: vertical; }
    .modal .hint { font-size: 0.8rem; color: var(--text-light); margin-top: 4px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 8px; }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .btn-cancel { background: #eee; color: #333; }
    .btn-cancel:hover { background: #ddd; }
    .btn-save { background: var(--red); color: #fff; }
    .btn-save:hover { background: var(--red-hover); }
    .btn-danger { background: #c00; color: #fff; }
    .btn-danger:hover { background: #a00; }

    @media (max-width: 480px) {
      .header { flex-direction: column; align-items: flex-start; }
      .list-item { flex-direction: column; align-items: flex-start; }
      .list-item-actions { align-self: flex-end; }
      .info-grid { grid-template-columns: 1fr; }
      .action-buttons { flex-direction: column; }
      .action-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <span style="font-weight: 600;">🚗 Parc Auto</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-back" id="btn-home">← Accueil</button>
        <button class="btn-logout" id="btn-logout">Déconnexion</button>
      </div>
    </div>

    <!-- Sélecteur (si pas de paramètre vehicule) -->
    <div class="selector-bar" id="selector-bar" style="display:none;">
      <select id="vehicle-select">
        <option value="">— Choisir un véhicule —</option>
      </select>
    </div>

    <!-- Contenu -->
    <div id="content">
      <div class="empty-state">
        <div class="icon">🚗</div>
        <p>Chargement...</p>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal" id="modal-content"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, deleteUser } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, getDocs, collection, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA1V3UybXWyyMmO9fBH7jhuVUSFL3mDBPo",
      authDomain: "crf--thot.firebaseapp.com",
      projectId: "crf--thot",
      storageBucket: "crf--thot.firebasestorage.app",
      messagingSenderId: "242106713414",
      appId: "1:242106713414:web:76f4c6977264539ef85147",
      measurementId: "G-NF6W8FS69P"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const COLLECTION = 'P';

    let currentNivol = null;
    let userRole = null;
    let vehicles = [];
    let currentVehicleId = null;
    let currentVehicleData = null;

    const contentEl = document.getElementById('content');
    const selectorBar = document.getElementById('selector-bar');
    const vehicleSelect = document.getElementById('vehicle-select');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalContent = document.getElementById('modal-content');

    // Récupérer le paramètre vehicule
    const urlParams = new URLSearchParams(window.location.search);
    const vehiculeParam = urlParams.get('vehicule');

    // Vérification connexion
    onAuthStateChanged(auth, async (user) => {
      if (!user) { redirectToLogin(); return; }
      currentNivol = user.displayName;
      if (!currentNivol) {
        await deleteUser(user).catch(() => {});
        redirectToLogin();
        return;
      }

      // Déterminer le rôle
      try {
        const adminSnap = await getDoc(doc(db, 'A', currentNivol));
        if (adminSnap.exists()) userRole = 'admin';
        else {
          const userSnap = await getDoc(doc(db, 'U', currentNivol));
          if (userSnap.exists()) userRole = 'user';
          else {
            // Ni admin ni user → refus
            await deleteUser(user).catch(() => {});
            redirectToLogin();
            return;
          }
        }
      } catch (e) {
        userRole = 'user';
      }

      // Bouton accueil
      document.getElementById('btn-home').onclick = () => {
        window.location.href = userRole === 'admin' ? '../admin.html' : '../user.html';
      };

      // Charger les véhicules
      await loadVehicles();

      if (vehiculeParam) {
        // Véhicule spécifié dans l'URL
        await loadVehicle(vehiculeParam);
      } else {
        // Pas de paramètre → afficher le sélecteur
        showSelector();
      }
    });

    function redirectToLogin() {
      const currentUrl = encodeURIComponent(window.location.href);
      window.location.href = `../login.html?redirect=${currentUrl}`;
    }

    document.getElementById('btn-logout').addEventListener('click', async () => {
      const user = auth.currentUser;
      if (user) {
        await deleteUser(user).catch(() => {});
        window.location.href = '../login.html';
      }
    });

    vehicleSelect.addEventListener('change', () => {
      const id = vehicleSelect.value;
      if (id) {
        // Mettre à jour l'URL sans recharger
        const newUrl = `${window.location.pathname}?vehicule=${encodeURIComponent(id)}`;
        window.history.replaceState({}, '', newUrl);
        loadVehicle(id);
      }
    });

    // ===== CHARGEMENT =====
    async function loadVehicles() {
      try {
        const snap = await getDocs(collection(db, COLLECTION));
        vehicles = [];
        snap.forEach(d => {
          vehicles.push({ id: d.id, ...d.data() });
        });
        vehicles.sort((a, b) => (a.n || a.id).localeCompare(b.n || b.id, 'fr'));

        // Remplir le sélecteur (nom uniquement)
        vehicleSelect.innerHTML = '<option value="">— Choisir un véhicule —</option>';
        vehicles.forEach(v => {
          const label = v.n || v.id;
          const selected = v.id === vehiculeParam ? ' selected' : '';
          vehicleSelect.innerHTML += `<option value="${v.id}"${selected}>${escapeHtml(label)}</option>`;
        });
      } catch (e) {
        console.error(e);
      }
    }

    function showSelector() {
      selectorBar.style.display = 'flex';
      contentEl.innerHTML = `
        <div class="empty-state">
          <div class="icon">🚗</div>
          <p>Sélectionnez un véhicule pour voir ses informations.</p>
        </div>
      `;
    }

    async function loadVehicle(vehiculeId) {
      selectorBar.style.display = 'flex';
      try {
        const docSnap = await getDoc(doc(db, COLLECTION, vehiculeId));
        if (!docSnap.exists()) {
          contentEl.innerHTML = '<div class="empty-state"><p>Véhicule introuvable.</p></div>';
          return;
        }
        currentVehicleId = vehiculeId;
        currentVehicleData = { id: docSnap.id, ...docSnap.data() };
        vehicleSelect.value = vehiculeId;
        renderVehicle();
      } catch (e) {
        contentEl.innerHTML = '<div class="empty-state"><p>Erreur lors du chargement.</p></div>';
      }
    }

    // ===== HELPERS =====
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('fr-FR');
    }

    function getDateStatus(dateStr) {
      if (!dateStr) return null;
      const now = new Date();
      const date = new Date(dateStr);
      const diffDays = Math.ceil((date - now) / (1000 * 60 * 60 * 24));
      if (diffDays <= 0) return 'danger';
      if (diffDays <= 30) return 'warning';
      return 'ok';
    }

    function getDateBadge(dateStr) {
      if (!dateStr) return '<span class="badge">—</span>';
      const status = getDateStatus(dateStr);
      const formatted = new Date(dateStr).toLocaleDateString('fr-FR');
      const cls = status === 'danger' ? 'danger' : status === 'warning' ? 'warning' : 'ok';
      const label = status === 'danger' ? 'PÉRIMÉ' : status === 'warning' ? 'Proche' : 'OK';
      return `<span class="badge ${cls}">${formatted} · ${label}</span>`;
    }

    function getKmStatus(targetKm, currentKm) {
      if (!targetKm) return null;
      const diff = targetKm - currentKm;
      if (diff <= 0) return 'danger';
      if (diff <= 1000) return 'warning';
      return 'ok';
    }

    function getKmBadge(targetKm, currentKm) {
      if (!targetKm) return '<span class="badge">—</span>';
      const status = getKmStatus(targetKm, currentKm);
      const cls = status === 'danger' ? 'danger' : status === 'warning' ? 'warning' : 'ok';
      const label = status === 'danger' ? 'DÉPASSÉ' : status === 'warning' ? 'Proche' : 'OK';
      const diff = targetKm - currentKm;
      return `<span class="badge ${cls}">${targetKm} km (${diff > 0 ? '+' : ''}${diff}) · ${label}</span>`;
    }

    // Vérifier si un nettoyage/désinfection est requis selon la fréquence
    function getCleanStatus(lastDate, freqDays) {
      if (!freqDays || !lastDate) return null;
      const now = new Date();
      const last = new Date(lastDate);
      const diffDays = Math.floor((now - last) / (1000 * 60 * 60 * 24));
      if (diffDays >= freqDays) return 'danger';
      if (diffDays >= freqDays * 0.8) return 'warning';
      return 'ok';
    }

    function getCleanBadge(lastDate, freqDays) {
      if (!lastDate) return '<span class="badge">Jamais</span>';
      if (!freqDays) return `<span class="badge">${formatDate(lastDate)}</span>`;
      const status = getCleanStatus(lastDate, freqDays);
      const formatted = new Date(lastDate).toLocaleDateString('fr-FR');
      const cls = status === 'danger' ? 'danger' : status === 'warning' ? 'warning' : 'ok';
      const label = status === 'danger' ? 'À faire' : status === 'warning' ? 'Bientôt' : 'OK';
      return `<span class="badge ${cls}">${formatted} · ${label}</span>`;
    }

    // ===== RENDU =====
    function renderVehicle() {
      if (!currentVehicleData) return;
      const v = currentVehicleData;
      const currentKm = v.km || 0;

      // === SECTION INFORMATIONS ===
      let html = `
        <div class="card">
          <div class="card-header">
            <span>🚗 ${escapeHtml(v.n || v.im || v.id)}</span>
          </div>
          <div class="card-body">
            <div class="info-grid">
              <div class="info-item"><span class="info-label">Immatriculation</span><span class="info-value">${escapeHtml(v.im || '—')}</span></div>
              <div class="info-item"><span class="info-label">Nom</span><span class="info-value">${escapeHtml(v.n || '—')}</span></div>
              <div class="info-item"><span class="info-label">Type de carburant</span><span class="info-value">${escapeHtml(v.car || '—')}</span></div>
              <div class="info-item"><span class="info-label">Kilométrage</span><span class="info-value">${currentKm} km</span></div>
              <div class="info-item"><span class="info-label">Assurance</span><span class="info-value">${getDateBadge(v.ass)}</span></div>
              <div class="info-item"><span class="info-label">Contrôle Technique</span><span class="info-value">${getDateBadge(v.ct)}</span></div>
            </div>
            <div style="margin-top:14px;text-align:right;">
              <button class="btn-sm btn-icon" id="btn-edit-km" title="Mettre à jour le kilométrage">✏️ Modifier le kilométrage</button>
            </div>
          </div>
        </div>
      `;

      // === SECTION NETTOYAGE / DÉSINFECTION ===
      html += `
        <div class="card">
          <div class="card-header">
            <span>🧽 Nettoyage & Désinfection</span>
          </div>
          <div class="card-body">
            <div class="info-grid">
              <div class="info-item">
                <span class="info-label">Dernier nettoyage</span>
                <span class="info-value">${getCleanBadge(v.dn, v.fn)}</span>
              </div>
              <div class="info-item">
                <span class="info-label">Dernière désinfection</span>
                <span class="info-value">${getCleanBadge(v.dd, v.fd)}</span>
              </div>
            </div>
            <div class="action-buttons">
              <button class="action-btn clean" id="btn-clean">🧽 Nettoyage effectué</button>
              <button class="action-btn disinfect" id="btn-disinfect">🧴 Désinfection</button>
            </div>
          </div>
        </div>
      `;

      // === SECTION ENTRETIENS (lecture seule) ===
      const entretiens = v.en || [];
      if (entretiens.length > 0) {
        html += `
          <div class="card">
            <div class="card-header"><span>🔧 Entretiens (${entretiens.length})</span></div>
            <ul class="list">
              ${entretiens.slice().reverse().map(e => {
                let statutHtml = '';
                if (e.recType === 'km' && e.kmDeclencheur) statutHtml = getKmBadge(e.kmDeclencheur, currentKm);
                else if (e.date) statutHtml = getDateBadge(e.date);
                const recLabel = e.rec ? (e.recType === 'jour' ? `tous les ${e.rec}j` : `tous les ${e.rec}km`) : 'sans récurrence';
                return `
                  <li class="list-item">
                    <div class="list-item-main">
                      <span class="list-item-title">${escapeHtml(e.type || '—')} ${e.desc ? '· ' + escapeHtml(e.desc) : ''}</span>
                      <span class="list-item-sub">
                        ${e.date ? 'Date : ' + new Date(e.date).toLocaleDateString('fr-FR') : 'Pas de date'}
                        · ${recLabel}
                      </span>
                      <span class="list-item-sub">${statutHtml}</span>
                    </div>
                  </li>`;
              }).join('')}
            </ul>
          </div>
        `;
      }

      // === SECTION INCIDENTS ===
      const incidents = v.inc || [];
      html += `
        <div class="card">
          <div class="card-header">
            <span>⚠️ Incidents signalés (${incidents.length})</span>
          </div>
          <ul class="list">
            ${incidents.length === 0 ? '<li class="empty-state" style="padding:20px;"><p>Aucun incident signalé.</p></li>' : ''}
            ${incidents.slice().reverse().map(inc => {
              const prioCls = inc.p === 'Haute' ? 'danger' : inc.p === 'Moyenne' ? 'warning' : '';
              return `
                <li class="list-item">
                  <div class="list-item-main">
                    <span class="list-item-title">${escapeHtml(inc.t || '—')} <span class="badge ${prioCls}">${escapeHtml(inc.p || '—')}</span></span>
                    <span class="list-item-sub">${escapeHtml(inc.d || '')}</span>
                    <span class="list-item-sub" style="font-size:0.75rem;color:#999;">${formatDate(inc.dt)} · par ${escapeHtml(inc.n || '?')}</span>
                  </div>
                </li>`;
            }).join('')}
          </ul>
          <div class="card-body" style="padding-top:0;">
            <button class="action-btn incident" id="btn-incident" style="width:100%;">⚠️ Signaler un incident</button>
          </div>
        </div>
      `;

      contentEl.innerHTML = html;
      attachEvents();
    }

    function attachEvents() {
      document.getElementById('btn-edit-km')?.addEventListener('click', () => openEditKmModal());
      document.getElementById('btn-clean')?.addEventListener('click', () => openCleanModal());
      document.getElementById('btn-disinfect')?.addEventListener('click', () => openDisinfectModal());
      document.getElementById('btn-incident')?.addEventListener('click', () => openIncidentModal());
    }

    // ===== MODALS =====
    function openEditKmModal() {
      const v = currentVehicleData;
      modalContent.innerHTML = `
        <h3>Mettre à jour le kilométrage</h3>
        <div>
          <label>Kilométrage actuel : ${v.km || 0} km</label>
          <input type="number" id="modal-km" value="${v.km || 0}" min="0">
          <p class="hint">Entrez le nouveau kilométrage relevé sur le compteur.</p>
        </div>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="modal-cancel">Annuler</button>
          <button class="btn btn-save" id="modal-save">Enregistrer</button>
        </div>
      `;
      modalOverlay.style.display = 'flex';
      document.getElementById('modal-cancel').addEventListener('click', closeModal);
      document.getElementById('modal-save').addEventListener('click', async () => {
        const km = parseInt(document.getElementById('modal-km').value) || 0;
        try {
          await updateDoc(doc(db, COLLECTION, currentVehicleId), { km: km });
          await addLog(`Kilométrage mis à jour : ${km} km`);
          closeModal();
          await loadVehicle(currentVehicleId);
        } catch (e) { showInlineError('Erreur : ' + e.message); }
      });
    }

    function openCleanModal() {
      const v = currentVehicleData;
      const now = new Date();
      const nowStr = now.toLocaleString('fr-FR');
      modalContent.innerHTML = `
        <h3>🧽 Nettoyage effectué</h3>
        <p style="font-size:0.9rem;color:var(--text-light);">Confirmez-vous avoir effectué le nettoyage extérieur de ce véhicule ?</p>
        <div style="background:#f5f5f5;padding:12px;border-radius:8px;font-size:0.85rem;">
          <div><strong>Date :</strong> ${nowStr}</div>
          <div><strong>Par :</strong> ${escapeHtml(currentNivol)}</div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="modal-cancel">Annuler</button>
          <button class="btn btn-save" id="modal-save">Confirmer</button>
        </div>
      `;
      modalOverlay.style.display = 'flex';
      document.getElementById('modal-cancel').addEventListener('click', closeModal);
      document.getElementById('modal-save').addEventListener('click', async () => {
        try {
          const iso = new Date().toISOString();
          await updateDoc(doc(db, COLLECTION, currentVehicleId), {
            dn: iso,
            dnp: currentNivol
          });
          await addLog(`Nettoyage effectué`);
          closeModal();
          await loadVehicle(currentVehicleId);
        } catch (e) { showInlineError('Erreur : ' + e.message); }
      });
    }

    function openDisinfectModal() {
      const v = currentVehicleData;
      const now = new Date();
      const nowStr = now.toLocaleString('fr-FR');
      modalContent.innerHTML = `
        <h3>🧴 Désinfection</h3>
        <div>
          <label>Type de désinfection</label>
          <select id="modal-type">
            <option value="rapide">Rapide</option>
            <option value="complete">Complète</option>
            <option value="total">Totale</option>
          </select>
        </div>
        <div style="background:#f5f5f5;padding:12px;border-radius:8px;font-size:0.85rem;">
          <div><strong>Date :</strong> ${nowStr}</div>
          <div><strong>Par :</strong> ${escapeHtml(currentNivol)}</div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="modal-cancel">Annuler</button>
          <button class="btn btn-save" id="modal-save">Confirmer</button>
        </div>
      `;
      modalOverlay.style.display = 'flex';
      document.getElementById('modal-cancel').addEventListener('click', closeModal);
      document.getElementById('modal-save').addEventListener('click', async () => {
        const type = document.getElementById('modal-type').value;
        try {
          const iso = new Date().toISOString();
          await updateDoc(doc(db, COLLECTION, currentVehicleId), {
            dd: iso,
            ddp: currentNivol,
            ddt: type
          });
          await addLog(`Désinfection effectuée (${type})`);
          closeModal();
          await loadVehicle(currentVehicleId);
        } catch (e) { showInlineError('Erreur : ' + e.message); }
      });
    }

    function openIncidentModal() {
      modalContent.innerHTML = `
        <h3>⚠️ Signaler un incident</h3>
        <div><label>Titre</label><input type="text" id="modal-titre" placeholder="Ex: Pneu crevé"></div>
        <div><label>Description</label><textarea id="modal-desc" placeholder="Décrivez l'incident..."></textarea></div>
        <div>
          <label>Priorité</label>
          <select id="modal-prio">
            <option value="Basse">Basse</option>
            <option value="Moyenne" selected>Moyenne</option>
            <option value="Haute">Haute</option>
          </select>
        </div>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="modal-cancel">Annuler</button>
          <button class="btn btn-save" id="modal-save">Signaler</button>
        </div>
      `;
      modalOverlay.style.display = 'flex';
      document.getElementById('modal-cancel').addEventListener('click', closeModal);
      document.getElementById('modal-save').addEventListener('click', async () => {
        const t = document.getElementById('modal-titre').value.trim();
        const d = document.getElementById('modal-desc').value.trim();
        const p = document.getElementById('modal-prio').value;

        if (!t) { showInlineError('Titre requis.'); return; }

        try {
          const incident = {
            id: 'inc_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
            t: t,
            d: d,
            p: p,
            dt: new Date().toISOString(),
            n: currentNivol
          };

          const ref = doc(db, COLLECTION, currentVehicleId);
          const snap = await getDoc(ref);
          const incidents = snap.data().inc || [];
          incidents.push(incident);

          await updateDoc(ref, { inc: incidents });
          await addLog(`Incident signalé : "${t}" (${p})`);
          closeModal();
          await loadVehicle(currentVehicleId);
        } catch (e) { showInlineError('Erreur : ' + e.message); }
      });
    }

    // ===== LOG =====
    async function addLog(action) {
      const log = { n: currentNivol, t: new Date().toISOString(), a: action };
      try {
        const ref = doc(db, COLLECTION, currentVehicleId);
        const snap = await getDoc(ref);
        const logs = snap.data().h || [];
        logs.push(log);
        await updateDoc(ref, { h: logs.slice(-100) });
      } catch (e) { console.error('Log error:', e); }
    }

    // ===== ERREUR INLINE =====
    function showInlineError(msg) {
      let errEl = document.getElementById('modal-inline-error');
      if (!errEl) {
        errEl = document.createElement('div');
        errEl.id = 'modal-inline-error';
        errEl.style.cssText = 'background:#fff0f0;color:#c00;padding:10px 14px;border-radius:8px;font-size:0.9rem;font-weight:600;text-align:center;';
        modalContent.appendChild(errEl);
      }
      errEl.textContent = '⚠️ ' + msg;
      setTimeout(() => { if (errEl && errEl.parentNode) errEl.parentNode.removeChild(errEl); }, 4000);
    }

    function closeModal() {
      modalOverlay.style.display = 'none';
      modalContent.innerHTML = '';
    }

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });
  </script>
</body>
</html>
